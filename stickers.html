<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stickers Tulula</title>
<!-- 3-nov-2026 (Pablo, lista 278) · PANEL DE STICKERS para Chatwoot (Configuración › Integraciones › Panel de aplicaciones).
     Chatwoot le pasa a esta página la conversación abierta; al tocar un sticker, n8n (webhook tulula-sticker) lo manda por WhatsApp
     y deja una nota privada en la conversación. El teléfono NO sale de aquí: n8n lo lee de Chatwoot con el número de conversación. -->
<style>
:root{--bg:#fff;--tx:#1f1b17;--mu:#7a7268;--bd:#e6ded3;--ac:#8c6f4e;--ok:#15803d;--rd:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#1d1f24;--tx:#ece8e2;--mu:#a29a90;--bd:#33363d;--ac:#cbb79a;--ok:#4ade80;--rd:#f87171}}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 Manrope,system-ui,sans-serif;padding:12px}
h1{font-size:14px;font-weight:600;margin:0 0 4px}.n{color:var(--mu);font-size:12px;margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
button.s{border:1px solid var(--bd);background:transparent;border-radius:12px;padding:4px;cursor:pointer;transition:transform .1s}
button.s:hover{transform:scale(1.04);border-color:var(--ac)}button.s:disabled{opacity:.4;cursor:wait}
button.s img{width:100%;display:block}
#m{margin-top:10px;font-size:12px;min-height:18px}.ok{color:var(--ok)}.er{color:var(--rd)}
</style></head><body>
<h1>Stickers Tulula</h1>
<p class="n" id="para">Abre una conversación para enviar.</p>
<div class="g" id="g"></div>
<div id="m"></div>
<script>
const URL_N8N = 'https://n8n-production-4e716.up.railway.app/webhook/tulula-sticker';
const STICKERS = [['gracias', 'Gracias por tu compra'], ['confirmado', 'Pedido confirmado'], ['pago', 'Pago recibido'], ['camino', 'Va en camino'],
  ['encantar', 'Te va a encantar'], ['momento', 'Un momentito'], ['bienvenida', 'Bienvenida'], ['saludos', 'Lindo día']];
let CTX = null;
const $ = id => document.getElementById(id);
function msg(t, c) { $('m').className = c || ''; $('m').textContent = t; }
window.addEventListener('message', e => {
  let d = e.data; try { if (typeof d === 'string') d = JSON.parse(d); } catch (_) { return; }
  if (!d || d.event !== 'appContext' || !d.data) return;
  CTX = d.data;
  const c = CTX.contact || {}, cv = CTX.conversation || {};
  $('para').textContent = cv.id ? ('Para: ' + (c.name || c.phone_number || 'clienta') + ' · conversación #' + cv.id) : 'Abre una conversación para enviar.';
});
try { window.parent.postMessage('chatwoot-dashboard-app:fetch-info', '*'); } catch (_) {}
$('g').innerHTML = STICKERS.map(s => '<button class="s" data-k="' + s[0] + '" title="' + s[1] + '"><img src="stickers/' + s[0] + '.webp" alt="' + s[1] + '"></button>').join('');
document.querySelectorAll('button.s').forEach(b => b.addEventListener('click', async () => {
  const cv = CTX && CTX.conversation;
  if (!cv || !cv.id) { msg('Abre primero una conversación.', 'er'); try { window.parent.postMessage('chatwoot-dashboard-app:fetch-info', '*'); } catch (_) {} return; }
  const todos = document.querySelectorAll('button.s'); todos.forEach(x => x.disabled = true); msg('Enviando…');
  try {
    const r = await fetch(URL_N8N, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ conversacion: cv.id, sticker: b.dataset.k, agente: (CTX.currentAgent && CTX.currentAgent.name) || '' }) });
    const j = await r.json().catch(() => ({}));
    if (j.ok) msg('✓ Enviado: ' + b.title, 'ok'); else msg('No se envió: ' + (j.mensaje || ('error ' + r.status)), 'er');
  } catch (e) { msg('No se envió: sin conexión con n8n', 'er'); }
  todos.forEach(x => x.disabled = false);
}));
</script></body></html>

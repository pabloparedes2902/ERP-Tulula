<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playbook de Ventas Tulula v6</title>
<style>
  :root{
    --bg:#12161f; --panel:#1a2130; --card:#232b3b; --bd:#37455f; --hover:#5b7ab0;
    --txt:#e8edf5; --txt2:#9db0cc; --etapa:#7f93b8;
    --bot:#4d8ae0; --bot-card:#17314f; --hum:#e09244; --hum-card:#3f2c10; --cli:#8fa3c0;
    --ab:#9b7bff; --ok:#43c98a; --warn:#e0a63d; --bad:#ff5d5d; --morado:#8a63d2;
    --fuego-bg:rgba(255,93,93,.14); --sel:#ffd766;
    --f-am:#e8c94a; --f-na:#e8853d; --f-ro:#e04848; --f-ve:#3dbb7e;
  }
  body.light{
    --bg:#eef1f6; --panel:#fff; --card:#fff; --bd:#c8d3e2; --hover:#3f6cb8;
    --txt:#1d2735; --txt2:#5d6d86; --etapa:#7285a3;
    --bot:#2d64b8; --bot-card:#e4eefc; --hum:#c07a1a; --hum-card:#fcefdc; --cli:#5d6d86;
    --ab:#7452e0; --ok:#1f8f5f; --warn:#b8821f; --bad:#d93838; --morado:#7452e0;
    --fuego-bg:rgba(217,56,56,.10); --sel:#c78a00;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--bd);gap:8px;flex-wrap:wrap;flex-shrink:0}
  header h1{font-size:14.5px}
  .hbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .btn{background:var(--card);border:1.5px solid var(--bd);color:var(--txt);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12px;font-weight:700}
  .btn.on{background:var(--bot);border-color:var(--bot);color:#fff}
  .btn.rojo{border-color:var(--bad);color:var(--bad)}
  .btn.verde{border-color:var(--ok);color:var(--ok)}
  .barra2{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--bd);gap:8px;flex-wrap:wrap;flex-shrink:0}
  .miga{font-size:11.5px;font-weight:700;color:var(--txt2)}
  .leyenda{display:flex;gap:11px;font-size:10.5px;color:var(--txt2);flex-wrap:wrap}
  .leyenda b::before{content:'━━ ';font-weight:900}
  .ly-ok b::before{color:var(--ok)} .ly-warn b::before{color:var(--warn)} .ly-bad b::before{color:var(--bad)} .ly-hum b::before{color:var(--morado)}
  #viewport{flex:1;position:relative;overflow:hidden;cursor:grab}
  #viewport.arrastrando{cursor:grabbing}
  #world{position:absolute;top:0;left:0;transform-origin:0 0}
  svg.wires{position:absolute;top:0;left:0;overflow:visible}
  .wire{fill:none;stroke-width:2;stroke-linecap:round;opacity:.92;pointer-events:stroke;cursor:pointer}
  .wire.sel{stroke:var(--sel)!important;stroke-width:4}
  .wire.pend{stroke-dasharray:5 5;opacity:.65}
  .w-ok{stroke:var(--ok)} .w-warn{stroke:var(--warn)} .w-bad{stroke:var(--bad)} .w-hum{stroke:var(--morado)} .w-neutro{stroke:var(--etapa)}
  .w-hot{stroke-dasharray:7 5;animation:dash 1.1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-24}}
  .wlbl{font-size:10.5px;fill:var(--txt2);font-weight:700;pointer-events:none}
  .wpct{font-size:10px;font-weight:800;fill:var(--ok);pointer-events:none}
  .wpct.warn{fill:var(--warn)} .wpct.bad{fill:var(--bad)} .wpct.hum{fill:var(--morado)}
  .guia{position:absolute;top:-30px;white-space:nowrap;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--etapa);pointer-events:none}
  .nodo{position:absolute;width:270px;border-radius:11px;padding:8px 11px;cursor:move;font-size:12px;user-select:none;border:1.5px solid var(--bd)}
  .nodo.own-bot{background:var(--bot-card);border-color:color-mix(in srgb, var(--bot) 55%, var(--bd))}
  .nodo.own-hum{background:var(--hum-card);border-color:color-mix(in srgb, var(--hum) 55%, var(--bd))}
  .nodo.own-cli{background:var(--card)}
  .nodo:hover{border-color:var(--hover)}
  .nodo.sel{border-color:var(--sel)!important;box-shadow:0 0 0 3px rgba(255,215,102,.2)}
  .nodo .etq{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--etapa);font-weight:800}
  .nodo .etq .quien{font-weight:900}
  .nodo.own-bot .etq .quien{color:var(--bot)} .nodo.own-hum .etq .quien{color:var(--hum)} .nodo.own-cli .etq .quien{color:var(--cli)}
  .nodo .nom{font-size:13px;font-weight:700;line-height:1.25;margin-top:2px}
  .nodo .msg{background:rgba(0,0,0,.22);border-left:3px solid var(--bot);border-radius:5px;padding:6px 8px;font-size:10.5px;margin-top:6px;line-height:1.45}
  body.light .nodo .msg{background:rgba(0,0,0,.05)}
  .nodo.own-hum .msg{border-left-color:var(--hum)} .nodo.own-cli .msg{border-left-color:var(--cli)}
  .parte{display:flex;gap:6px;align-items:flex-start;background:rgba(0,0,0,.22);border-left:3px solid var(--bot);border-radius:5px;padding:5px 7px;font-size:10.5px;margin-top:5px;line-height:1.45;position:relative}
  body.light .parte{background:rgba(0,0,0,.05)}
  .nodo.own-hum .parte{border-left-color:var(--hum)} .nodo.own-cli .parte{border-left-color:var(--cli)}
  .parte .picon{flex-shrink:0;font-size:12px}
  .parte .ptxt{flex:1}
  .parte .pdel{color:var(--bad);font-weight:900;cursor:pointer;padding:0 3px}
  .paddrow{display:flex;gap:5px;margin-top:6px}
  .padd{font-size:10px;font-weight:800;border:1px dashed var(--bd);border-radius:6px;padding:2px 6px;cursor:pointer;color:var(--txt2)}
  .padd:hover{border-color:var(--hover);color:var(--txt)}
  .nodo .pie{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
  .nodo [contenteditable="true"]{outline:1.5px dashed var(--warn);outline-offset:2px;cursor:text}
  .hout{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:var(--bot);border:2.5px solid var(--bg);cursor:crosshair;z-index:4}
  .hout:hover{background:var(--sel)}
  .b{font-size:8.5px;font-weight:800;padding:2px 6px;border-radius:7px}
  .b.bot{background:rgba(77,138,224,.2);color:var(--bot)} .b.hum{background:rgba(224,146,68,.22);color:var(--hum)}
  .b.ab{border:1px solid var(--ab);color:var(--ab)}
  .b.t-v{border:1px solid var(--ok);color:var(--ok)} .b.t-a{border:1px solid var(--warn);color:var(--warn)} .b.t-r{border:1px solid var(--bad);color:var(--bad)}
  .nodo.fuego{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--fuego-bg);animation:pulso 1.6s infinite}
  @keyframes pulso{50%{box-shadow:0 0 0 7px var(--fuego-bg)}}
  .ehandle{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--sel);border:2px solid var(--bg);cursor:crosshair;z-index:6}
  .edel{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:6}
  .ntool{position:absolute;display:flex;gap:4px;background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:4px 6px;z-index:8;box-shadow:0 3px 10px rgba(0,0,0,.3)}
  .ntool span{cursor:pointer;font-size:13px;padding:2px 5px;border-radius:5px}
  .ntool span:hover{background:var(--card)}
  .eedit{position:absolute;display:flex;gap:5px;align-items:center;background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:5px 7px;z-index:9;box-shadow:0 3px 10px rgba(0,0,0,.3)}
  .eedit input{background:var(--card);border:1px solid var(--bd);color:var(--txt);border-radius:6px;padding:4px 7px;font-size:11.5px;width:170px}
  .eedit .dot{width:14px;height:14px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  .eedit .dot.on{border-color:#fff}
  #hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--bd);border-radius:9px;padding:7px 14px;font-size:11.5px;color:var(--txt2);z-index:30;white-space:nowrap}
  #estadoGuardado{font-size:10.5px;color:var(--txt2)}
  /* EMBUDO 3D (igual v5) */
  #vEmbudo{display:none;flex:1;overflow:auto;padding:18px}
  .periodos{display:flex;gap:7px;justify-content:center;margin-bottom:6px;flex-wrap:wrap;align-items:center}
  .periodos input{background:var(--card);border:1.5px solid var(--bd);color:var(--txt);border-radius:8px;padding:5px 8px;font-size:12px}
  #embEstado{font-size:11.5px;color:var(--txt2);text-align:center;margin:6px 0 20px}
  #embZona{width:560px;margin:0 auto;position:relative}
  .seg{position:relative;margin:0 auto;color:#15181c;text-align:center}
  .seg .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .seg .fpct{font-size:30px;font-weight:900;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.25)}
  .seg .fn{font-size:10.5px;font-weight:800;letter-spacing:.14em;opacity:.72}
  .seg .fc{font-size:19px;font-weight:800;opacity:.8}
  .fizq{position:absolute;top:50%;transform:translateY(-50%);font-size:15px;font-weight:900;letter-spacing:.14em;color:var(--txt2);white-space:nowrap}
  .boca{margin:0 auto;border-radius:50%;position:relative;z-index:2}
  .ftrans{text-align:center;font-size:12px;color:var(--txt2);margin:6px 0;font-weight:700}
  .ftrans .fok{color:var(--ok)} .ftrans .fbad{color:var(--bad)}
  .ffuego{display:inline-block;background:var(--bad);color:#fff;border-radius:8px;padding:2px 9px;font-size:11px;font-weight:800;margin-left:6px}
  .tubo{margin:0 auto;width:64px}
</style>
</head>
<body>
<header>
  <h1>🧭 Flujo de ventas <span id="tagViewer"></span></h1>
  <div class="hbtns">
    <button class="btn on" id="bDetalle" onclick="irVista('detalle')">Flujo</button>
    <button class="btn" id="bEmbudo" onclick="irVista('embudo')">Embudo</button>
    <button class="btn" id="bEspera" onclick="irVista('espera')">Espera</button>
    <span id="estadoGuardado"></span>
    <button class="btn" onclick="document.body.classList.toggle('light');this.textContent=document.body.classList.contains('light')?'🌙':'☀️'">☀️</button>
  </div>
</header>
<div class="barra2" id="barra2">
  <div class="miga" id="miga"></div>
  <div class="leyenda"><span class="ly-ok"><b></b>vende</span><span class="ly-warn"><b></b>objeción</span><span class="ly-bad"><b></b>fuga</span><span class="ly-hum"><b></b>asesora</span><span>🔵 bot · 🟠 asesora · ⚪ clienta · 🔥 oportunidad · ╌╌ roja animada = LA fuga principal</span></div>
  <div style="display:flex;gap:6px"><span id="editBtns" style="display:flex;gap:6px"><button class="btn" onclick="nuevoBox()">➕ Box</button><button class="btn rojo" id="bBorrar" onclick="borrarSel()" style="display:none">🗑</button><button class="btn" onclick="deshacer()" title="deshacer">↶</button></span><button class="btn" onclick="zoom(1.2)">＋</button><button class="btn" onclick="zoom(1/1.2)">－</button><button class="btn" onclick="fitView()">⤢ Ajustar</button></div>
</div>
<div id="viewport"><div id="world"></div><div id="hint" style="display:none"></div><button class="btn verde" id="bGuardarFlot" style="display:none;position:absolute;bottom:16px;right:16px;z-index:40;font-size:13px;padding:9px 16px" onclick="guardarNube()">💾 Guardar cambios</button></div>
<div id="vEspera" style="display:none;padding:26px;max-width:860px;margin:0 auto">
  <h2 style="margin:0 0 4px">🔔 Clientas esperando ahora</h2>
  <div id="espEstado" style="color:var(--txt2);font-size:12px;margin-bottom:14px"></div>
  <div id="espLista"></div>
</div>
<div id="vEmbudo">
  <div class="periodos">
    <button class="btn on" data-p="mtd" onclick="setPeriodo('mtd',this)">Mes hasta hoy</button>
    <button class="btn" data-p="7" onclick="setPeriodo('7',this)">7 días</button>
    <button class="btn" data-p="15" onclick="setPeriodo('15',this)">15 días</button>
    <button class="btn" data-p="30" onclick="setPeriodo('30',this)">30 días</button>
    <input type="date" id="pDesde"> <input type="date" id="pHasta">
    <button class="btn" onclick="setPeriodo('custom',null)">Aplicar</button>
  </div>
  <div id="embEstado">—</div>
  <div id="embZona"></div>
</div>

<script>
'use strict';
const MODO_VIEWER = !/(^|[?&])edit=1(&|$)/.test(location.search.slice(1)); /* editor solo con ?edit=1 (lo pasa el ERP si MY_ROLE es Administrador) */
const BASE_N8N = 'https://n8n-production-4e716.up.railway.app/webhook';
const URL_EMBUDO = BASE_N8N + '/embudo-rango'; /* historico Postgres (se llena cada noche 3am) */
const URL_GUARDAR = BASE_N8N + '/playbook-guardar';
const URL_CARGAR = BASE_N8N + '/playbook-cargar';
const BENCH = { t1:65, t2:45, t3:40 };
const B='bot', H='hum', C='cli';
const QUIEN = { bot:'🤖 TULA', hum:'👩‍💼 ASESORA', cli:'🙋‍♀️ CLIENTA' };

/* ===== FLUJO por defecto (canal anuncios · un solo grafo) ===== */
let FLUJO = { v: 7, nodes:[
  {id:'e1', x:50,  y:200, etapa:'1 · Entrada', nom:'Clic en el anuncio + primer mensaje', own:C, msg:'Hola! ✨ Quiero más información sobre el [producto] por favor. (llega del anuncio de Meta con el producto ya visto)', sem:'v', tasa:'100%'},
  {id:'e2', x:390, y:200, etapa:'1 · Entrada', nom:'Bienvenida + foto + precio', own:B, ab:1, partes:[{t:'foto',txt:'(foto del producto con tabla de tallas y colores)'},{t:'texto',txt:'Hola! soy Tula de Tulula \ud83d\ude0a te muestro el [producto] al toque \u2014 est\u00e1 S/[precio] y viene en [colores]. en qu\u00e9 talla lo usas?'}], sem:'v', tasa:'96% entregado'},
  {id:'q1',x:730, y:40,   etapa:'2 · Diagnóstico', nom:'Da su talla', own:C, msg:'"M porfa" · "uso 28" · "talla L"'},
  {id:'q2',x:730, y:220,  etapa:'2 · Diagnóstico', nom:'Pregunta o cuestiona el precio', own:C, msg:'"cuánto está?" · "está caro" · "en Gamarra lo vi más barato"'},
  {id:'q3',x:730, y:400,  etapa:'2 · Diagnóstico', nom:'Duda de su talla', own:C, msg:'"no sé mi talla" · "soy gordita de la cintura" · "las tallas son completas?"'},
  {id:'q4',x:730, y:580,  etapa:'2 · Diagnóstico', nom:'Pide más fotos / otro color', own:C, msg:'"me mandas fotos del marrón?" · "tienes en chocolate?"'},
  {id:'q5',x:730, y:760,  etapa:'2 · Diagnóstico', nom:'Pregunta por el envío', own:C, msg:'"hacen envíos a provincia?" · "cuándo llega?" · "cuánto el envío?" · "lo necesito para el viernes"'},
  {id:'q6',x:730, y:940,  etapa:'2 · Diagnóstico', nom:'Duda de confianza / pago', own:C, msg:'"es confiable?" · "pago contra entrega?" · "cómo sé que van a enviar?"'},
  {id:'q7',x:730, y:1120, etapa:'2 · Diagnóstico', nom:'Pregunta por tienda física', own:C, msg:'"tienen tienda para probarme?" · "dónde están ubicados?"'},
  {id:'q8',x:730, y:1300, etapa:'2 · Diagnóstico', nom:'Pide catálogo / otros modelos', own:C, msg:'"tienen pantalones?" · "catálogo porfa" · "qué blusas tienes?"'},
  {id:'q9',x:730, y:1480, etapa:'2 · Diagnóstico', nom:'Manda captura del anuncio', own:C, partes:[{t:'foto',txt:'(screenshot del anuncio o de la prenda \u2014 su forma de decir "quiero esto")'}]},
  {id:'q10',x:730, y:1660, etapa:'2 · Diagnóstico', nom:'Pide humano · reclamo · mayorista', own:C, msg:'"me atiende una persona porfa" · "mi pedido llegó fallado" · "quiero para revender"', pct6:1},
  {id:'q11',x:730, y:1840, etapa:'2 · Diagnóstico', nom:'NO responde', own:C, fuego:1, msg:'(silencio después de ver foto y precio — el 35% de las conversaciones)', sem:'r', tasa:'35% de convs'},
  {id:'r2',x:1070, y:240,  etapa:'3 · Respuesta', nom:'PRECIO (script aprobado)', own:B, ab:1, msg:'tiene razón bella, no es un producto barato, y es porque queremos que tenga una prenda que no se destiña ni se deforme 😊 pero si el precio es lo que la detiene, por ser su primera compra le ofrezco un 10% de descuento sobre el precio de lista', sem:'a', tasa:'41% resp'},
  {id:'r3',x:1070, y:450,  etapa:'3 · Respuesta', nom:'DUDA-TALLA', own:B, ab:1, msg:'bella me comenta si logró verificar sus medidas 😊 con su [busto (prenda de arriba) / cintura (abajo)] le confirmo su talla · cambios hasta 15 días, primer cambio gratis en 1ª compra', sem:'a', tasa:'26% casos'},
  {id:'r4',x:1070, y:660,  etapa:'3 · Respuesta', nom:'FOTOS / OTRO COLOR', own:B, partes:[{t:'texto',txt:'claro bella, le env\u00edo la foto del [color] \ud83d\ude0a'},{t:'foto',txt:'(foto de ESE color \u2014 nunca repetir la misma; si no est\u00e1 en stock: "d\u00e9jame confirmarte ese color" + escala)'}], sem:'r', tasa:'error freq.'},
  {id:'r5',x:1070, y:870,  etapa:'3 · Respuesta', nom:'ENVÍO-FECHA', own:B, msg:'se encuentra en Lima? para decirle exacto cuándo le llega 😊 · si dio FECHA: "para que llegue antes del [fecha] tendríamos que programarlo hoy, estaría bien?"', sem:'a', tasa:'11% casos'},
  {id:'r6',x:1070, y:1080,  etapa:'3 · Respuesta', nom:'MIEDO-PLATA (semi-COD plan B)', own:B, partes:[{t:'texto',txt:'bella si gustas puedes adelantar 10 y el resto lo pagas al recibir con el motorizado para tu tranquilidad, te parece? 😊 (Lima)'},{t:'foto',txt:'(si duda fuerte: foto de los pedidos que salen hoy del almac\u00e9n)'},{t:'audio',txt:'(aprobado: audio pregrabado de Angie explicando el contra entrega \u2014 derrite la desconfianza)'}], sem:'a', tasa:'9% casos'},
  {id:'r7',x:1070, y:1290, etapa:'3 · Respuesta', nom:'TIENDA FÍSICA (solo Lima)', own:B, msg:'estamos en Santa Anita, a espaldas del Mall Aventura 😊 es con previa cita: L-V 9-4, sáb 9-12. me confirma qué día desea? (dirección exacta al confirmar → reserva vía asesora)', sem:'a', tasa:'4% casos'},
  {id:'r8',x:1070, y:1500, etapa:'3 · Respuesta', nom:'CATÁLOGO (2-3 opciones máx)', own:B, partes:[{t:'foto',txt:'(2-3 fotos con precio \u2014 nunca un listado completo)'},{t:'texto',txt:'te muestro los que m\u00e1s salen \ud83d\ude0a cu\u00e1l va m\u00e1s contigo?'}], sem:'v', tasa:'—'},
  {id:'r9',x:1070, y:1710, etapa:'3 · Respuesta', nom:'IDENTIFICAR CAPTURA', own:B, msg:'ah sí, ese es el [producto] 😊 está S/[precio] y va desde la S hasta la 2XL. qué talla usas? (si no está segura: mejor apuesta + confirmación — NUNCA "no veo")', sem:'r', tasa:'sin Vision'},
  {id:'v1', x:1410, y:120, etapa:'4 · Venta', nom:'Colores en SU talla', own:B, partes:[{t:'texto',txt:'uy buena elecci\u00f3n \ud83d\ude0a en [talla] tengo: [colores del stock real]. cu\u00e1l te gusta m\u00e1s?'},{t:'foto',txt:'(si pide ver un color: foto de ese color)'}], sem:'a', tasa:'stock pendiente'},
  {id:'v2', x:1750, y:120, etapa:'4 · Venta', nom:'Elige color', own:C, msg:'"el negro porfa" · "el camel" · "me gustó el marrón"'},
  {id:'u1', x:2090, y:120, etapa:'4 · Venta', nom:'Pregunta la ubicación', own:B, msg:'te encuentras en Lima? 😊 para cotizarte tu envío', sem:'v', tasa:'—'},

/* ===== ESTADO / HELPERS ===== */
const world = document.getElementById('world'), vp = document.getElementById('viewport');
const NW = 270;
let esc = 1, tx = 20, ty = 10;
let selNodo = null, selEdge = null, undoStack = [];
let nodeD = null, panD = null, linking = null, relinking = null;
const nodoEl = id => document.querySelector(`.nodo[data-n="${id}"]`);
function alto(n){ const el = nodoEl(n.id); return el ? el.offsetHeight : 110; }
function toWorld(e){ const r = vp.getBoundingClientRect(); return { x:(e.clientX-r.left-tx)/esc, y:(e.clientY-r.top-ty)/esc }; }
const ICONO = { texto:'\u{1F4AC}', foto:'\u{1F4F7}', audio:'\u{1F399}', video:'\u{1F3AC}' };
function getPartes(n){ if (!n.partes){ n.partes = [{t:'texto', txt:(n.msg||'')}]; delete n.msg; } return n.partes; }
function partesHTML(n){
  return getPartes(n).map((pt,i) =>
    `<div class="parte"><span class="picon" title="${pt.t}">${ICONO[pt.t]||'\u{1F4AC}'}</span>` +
    `<span class="ptxt" data-f="parte" data-i="${i}">${(pt.txt||'').replace(/\n/g,'<br>')}</span>` +
    (selNodo===n.id ? `<span class="pdel" data-pdel="${i}" title="quitar">\u00d7</span>` : '') + `</div>`
  ).join('') + (selNodo===n.id ?
    `<div class="paddrow">${Object.keys(ICONO).map(t=>`<span class="padd" data-padd="${t}" title="agregar ${t}">${ICONO[t]}+</span>`).join('')}</div>` : '');
}
let autoT = null;
function marcarSucio(){
  const b = document.getElementById('bGuardarFlot');
  b.style.display='block'; b.textContent='💾 Guardando en 3s… (o clic para guardar ya)'; b.classList.remove('on');
  clearTimeout(autoT); autoT = setTimeout(guardarNube, 3000);
}
function snapshot(){ undoStack.push(JSON.stringify(FLUJO)); if (undoStack.length>50) undoStack.shift(); }
function deshacer(){ if (undoStack.length){ FLUJO = JSON.parse(undoStack.pop()); selNodo=selEdge=null; render(); } }
function hint(t){ const h=document.getElementById('hint'); if(!t){h.style.display='none';return;} h.textContent=t; h.style.display='block'; }

/* ===== RENDER ===== */
function endPoint(e, pos){
  if (e.b && pos[e.b]) return { x: pos[e.b].x - 7, y: pos[e.b].y + alto(pos[e.b])/2 };
  return { x: e.bx || 0, y: e.by || 0 };
}
function pathFor(e, pos){
  const a = pos[e.a]; if (!a) return null;
  const x1 = a.x + NW, y1 = a.y + alto(a)/2, p2 = endPoint(e, pos);
  const dx = p2.x - x1;
  const o = dx >= 0 ? Math.min(Math.max(dx*0.5, 55), 260) : Math.min(Math.max(-dx*0.6, 90), 340);
  /* salida horizontal estilo n8n; la ENTRADA sigue la dirección real de la línea para que la punta de flecha tenga la inclinación exacta */
  let c2x, c2y;
  if (dx >= 0){
    const ang = Math.atan2(p2.y - y1, p2.x - x1);
    const o2 = Math.min(o, Math.max(45, Math.hypot(p2.x-x1, p2.y-y1)*0.35));
    c2x = p2.x - Math.cos(ang)*o2; c2y = p2.y - Math.sin(ang)*o2;
  } else { c2x = p2.x - o; c2y = p2.y; } /* lazos hacia atrás: entrada horizontal (la flecha apunta como llega el lazo) */
  const d = `M${x1},${y1} C${x1+o},${y1} ${c2x},${c2y} ${p2.x},${p2.y}`;
  return { d, mx:(x1+p2.x)/2, my:(y1+p2.y)/2, x1, y1, x2:p2.x, y2:p2.y };
}
function render(){
  const maxX = Math.max(...FLUJO.nodes.map(n=>n.x)) + 700;
  let html = '';
  const altoTotal = Math.max(...FLUJO.nodes.map(n=>n.y)) + 320;
  for (const b of BANDAS){
    html += `<div style="position:absolute;left:${b.x}px;top:0;width:${b.w}px;height:${altoTotal}px;background:${b.c};border-radius:14px;pointer-events:none"></div>`;
    html += `<div class="guia" style="left:${b.x+12}px">${b.t}</div>`;
  }
  const _na1 = FLUJO.nodes.find(n=>n.id==='a1');
  if (_na1) html += `<div class="guia" style="left:${_na1.x-8}px;top:${_na1.y-36}px;color:var(--hum)">ESCALAMIENTO · transversal — puede dispararse desde cualquier etapa</div>`;
  for (const n of FLUJO.nodes){
    html += `<div class="nodo own-${n.own}${n.fuego?' fuego':''}${selNodo===n.id?' sel':''}" style="left:${n.x}px;top:${n.y}px" data-n="${n.id}">` +
      `<div class="hout" data-h="${n.id}" title="arrastra para conectar"></div>` +
      `<div class="etq"><span class="quien">${QUIEN[n.own]||''}</span> · <span data-f="etapa">${n.etapa||''}</span></div>` +
      `<div class="nom" data-f="nom">${n.nom}</div>` +
      partesHTML(n) +
      `<div class="pie">${n.ab?'<span class="b ab">A/B</span>':''}` +
      (n.tasa?`<span class="b t-${n.sem||'a'}">${n.sem==='v'?'🟢':n.sem==='r'?'🔴':'🟡'} ${n.tasa}</span>`:'') + `</div></div>`;
  }
  world.innerHTML = `<svg class="wires" id="svgw" width="${maxX}" height="${altoTotal}"><defs>` +
    `<marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>` +
    `</defs><g id="svgg"></g></svg>` + html;
  drawEdges();
}
function drawEdges(){
  const pos = {}; FLUJO.nodes.forEach(n => pos[n.id] = n);
  let s = '';
  FLUJO.edges.forEach((e, i) => {
    const p = pathFor(e, pos); if (!p) return;
    const pend = !e.b ? ' pend' : '';
    s += `<path class="wire w-${e.ruta||'neutro'}${e.hot?' w-hot':''}${selEdge===i?' sel':''}${pend}" data-e="${i}" d="${p.d}" marker-end="url(#flecha)"/>`;
    if (e.lbl) s += `<text class="wlbl" x="${p.mx-44}" y="${p.my-8}">${e.lbl}</text>`;
    if (e.pct) s += `<text class="wpct ${e.ruta}" x="${p.mx-14}" y="${p.my+9}">${e.pct}</text>`;
  });
  if (linking) s += `<path class="wire w-neutro pend" d="M${linking.x1},${linking.y1} L${linking.x},${linking.y}" marker-end="url(#flecha)"/>`;
  document.getElementById('svgg').innerHTML = s;
  /* limpiar overlays de edge */
  document.querySelectorAll('.ehandle,.edel,.ntool,.eedit').forEach(x=>x.remove());
  if (selNodo && !MODO_VIEWER){
    const nn = FLUJO.nodes.find(x=>x.id===selNodo);
    if (nn){
      const tb = document.createElement('div'); tb.className='ntool';
      tb.style.left = nn.x+'px'; tb.style.top = (nn.y-36)+'px';
      tb.innerHTML = `<span data-act="edit" title="editar texto">✏️</span>` +
        `<span data-act="actor" title="cambiar actor">${nn.own===B?'🤖':nn.own===H?'👩‍💼':'🙋‍♀️'}</span>` +
        `<span data-act="ab" title="A/B" style="${nn.ab?'color:var(--ab);font-weight:900':''}">A/B</span>` +
        `<span data-act="dup" title="duplicar">⧉</span><span data-act="del" title="eliminar" style="color:var(--bad)">🗑</span>`;
      world.appendChild(tb);
    }
  }
  const overlay = (cls, x, y, html2, attrs) => {
    const d = document.createElement('div'); d.className = cls;
    d.style.left = (x-8)+'px'; d.style.top = (y-8)+'px'; d.innerHTML = html2||'';
    for (const k in (attrs||{})) d.dataset[k] = attrs[k];
    world.appendChild(d);
  };
  FLUJO.edges.forEach((e, i) => {
    const p = pathFor(e, pos); if (!p) return;
    if (!e.b) overlay('ehandle', p.x2, p.y2, '', {re:i, end:'b'});           /* punta suelta siempre agarrable */
    if (selEdge === i){
      overlay('ehandle', p.x1, p.y1, '', {re:i, end:'a'});
      overlay('ehandle', p.x2, p.y2, '', {re:i, end:'b'});
      overlay('edel', p.mx, p.my-2, '✕', {del:i});
    }
  });
}

/* ===== INTERACCIÓN ===== */
function aplicar(){ world.style.transform = `translate(${tx}px,${ty}px) scale(${esc})`; }
function zoom(f){ esc = Math.min(2.4, Math.max(0.2, esc*f)); aplicar(); }
function fitView(){
  const xs = FLUJO.nodes.map(n=>n.x), ys = FLUJO.nodes.map(n=>n.y);
  const minX = Math.min(...xs)-40, minY = Math.min(...ys)-60;
  const maxY = Math.max(...ys)+280;
  const r = vp.getBoundingClientRect();
  /* solo el ALTO manda: todo el flujo visible verticalmente; el ancho se recorre con la manito */
  esc = Math.min((r.height-16)/(maxY-minY), 1.2);
  tx = -minX*esc + 10; ty = -minY*esc + 8; aplicar();
}
vp.addEventListener('pointerdown', e => {
  if (e.target.isContentEditable) return;
  if (MODO_VIEWER){
    const w0 = e.target.closest('.wire');
    if (!w0 && !e.target.closest('.btn')){ panD = { x: e.clientX - tx, y: e.clientY - ty }; vp.classList.add('arrastrando'); vp.setPointerCapture(e.pointerId); }
    return;
  }
  const eh = e.target.closest('.ehandle');
  if (eh){ snapshot(); relinking = { i: parseInt(eh.dataset.re), end: eh.dataset.end }; vp.setPointerCapture(e.pointerId); return; }
  const ed = e.target.closest('.edel');
  if (ed){ snapshot(); marcarSucio(); FLUJO.edges.splice(parseInt(ed.dataset.del),1); selEdge=null; document.getElementById('bBorrar').style.display='none'; drawEdges(); return; }
  const h = e.target.closest('.hout');
  if (h){
    const n = FLUJO.nodes.find(x=>x.id===h.dataset.h);
    linking = { from:n.id, x1:n.x+NW, y1:n.y+alto(n)/2, x:n.x+NW+20, y:n.y+alto(n)/2 };
    hint('Suelta sobre un box = conectar · en el vacío = box nuevo conectado · Shift = dejarlo pendiente');
    vp.setPointerCapture(e.pointerId); return;
  }
  const ta = e.target.closest('.ntool span');
  if (ta){
    const n = FLUJO.nodes.find(x=>x.id===selNodo); if (!n) return;
    snapshot(); marcarSucio();
    const act = ta.dataset.act;
    if (act==='edit'){ undoStack.pop(); e.preventDefault(); setTimeout(function(){ editarNodo(n.id); }, 0); return; }
    if (act==='del' && !ta.dataset.conf){ undoStack.pop(); ta.dataset.conf='1'; ta.textContent='¿Eliminar?'; ta.style.fontWeight='900'; return; }
    if (act==='actor') n.own = n.own===B ? H : (n.own===H ? C : B);
    if (act==='ab') n.ab = n.ab ? 0 : 1;
    if (act==='dup'){
      const nid = 'x'+Date.now().toString(36);
      const cp = JSON.parse(JSON.stringify(n)); cp.id = nid; cp.x = n.x+40; cp.y = n.y+40;
      FLUJO.nodes.push(cp); selNodo = nid;
    }
    if (act==='del'){ FLUJO.nodes = FLUJO.nodes.filter(x=>x.id!==n.id); FLUJO.edges = FLUJO.edges.filter(ed=>ed.a!==n.id && ed.b!==n.id); selNodo = null; }
    render(); return;
  }
  if (e.target.closest('.eedit')) return;
  const pa = e.target.closest('.padd');
  if (pa){ const n = FLUJO.nodes.find(x=>x.id===pa.closest('.nodo').dataset.n); snapshot(); marcarSucio(); getPartes(n).push({t:pa.dataset.padd, txt:'(doble clic para describir el '+pa.dataset.padd+')'}); render(); return; }
  const pd = e.target.closest('.pdel');
  if (pd){ const n = FLUJO.nodes.find(x=>x.id===pd.closest('.nodo').dataset.n); snapshot(); marcarSucio(); getPartes(n).splice(parseInt(pd.dataset.pdel),1); render(); return; }
  const nEl = e.target.closest('.nodo');
  if (nEl){
    const n = FLUJO.nodes.find(x=>x.id===nEl.dataset.n);
    selNodo = n.id; selEdge = null; snapshot();
    nodeD = { n, dx: toWorld(e).x - n.x, dy: toWorld(e).y - n.y, movido:false };
    document.querySelectorAll('.nodo').forEach(x=>x.classList.toggle('sel', x.dataset.n===n.id));
    document.getElementById('bBorrar').style.display='inline-block';
    drawEdges(); vp.setPointerCapture(e.pointerId); return;
  }
  const w = e.target.closest('.wire');
  if (w){ selEdge = parseInt(w.dataset.e); selNodo = null; document.getElementById('bBorrar').style.display='inline-block'; document.querySelectorAll('.nodo').forEach(x=>x.classList.remove('sel')); drawEdges(); hint('Conector: arrastra sus puntas para re-conectarlo · ✕ o Supr elimina · doble clic para etiqueta y color'); return; }
  selNodo = null; selEdge = null; document.getElementById('bBorrar').style.display='none';
  document.querySelectorAll('.nodo').forEach(x=>x.classList.remove('sel')); drawEdges(); hint(null);
  panD = { x: e.clientX - tx, y: e.clientY - ty }; vp.classList.add('arrastrando'); vp.setPointerCapture(e.pointerId);
});
vp.addEventListener('pointermove', e => {
  const wpt = toWorld(e);
  if (relinking){ const ed = FLUJO.edges[relinking.i]; if (relinking.end==='b'){ ed.b = null; ed.bx = wpt.x; ed.by = wpt.y; } drawEdges(); return; }
  if (linking){ linking.x = wpt.x; linking.y = wpt.y; drawEdges(); return; }
  if (nodeD){
    nodeD.movido = true;
    nodeD.n.x = Math.round((wpt.x - nodeD.dx)/10)*10; nodeD.n.y = Math.round((wpt.y - nodeD.dy)/10)*10;
    const el = nodoEl(nodeD.n.id); el.style.left = nodeD.n.x+'px'; el.style.top = nodeD.n.y+'px';
    drawEdges(); return;
  }
  if (panD){ tx = e.clientX - panD.x; ty = e.clientY - panD.y; aplicar(); }
});
vp.addEventListener('pointerup', e => {
  const wpt = toWorld(e);
  const sobre = FLUJO.nodes.find(n => wpt.x >= n.x && wpt.x <= n.x+NW && wpt.y >= n.y && wpt.y <= n.y+alto(n));
  if (relinking){
    const ed = FLUJO.edges[relinking.i];
    if (relinking.end === 'a'){ if (sobre) ed.a = sobre.id; }
    else { if (sobre && sobre.id !== ed.a){ ed.b = sobre.id; delete ed.bx; delete ed.by; } }
    relinking = null; hint(null); marcarSucio(); drawEdges(); return;
  }
  if (linking){
    snapshot();
    if (sobre && sobre.id !== linking.from){ FLUJO.edges.push({ a: linking.from, b: sobre.id, ruta:'neutro', lbl:'' }); marcarSucio(); }
    else if (e.shiftKey){ FLUJO.edges.push({ a: linking.from, b: null, bx: wpt.x, by: wpt.y, ruta:'neutro', lbl:'' }); marcarSucio(); }
    else {
      const nid = 'x'+Date.now().toString(36);
      FLUJO.nodes.push({ id:nid, x:Math.round(wpt.x/10)*10, y:Math.round((wpt.y-40)/10)*10, etapa:'(etapa)', nom:'Nuevo mensaje', own:B, partes:[{t:'texto', txt:'doble clic para escribir…'}], sem:'a', tasa:'—' });
      FLUJO.edges.push({ a: linking.from, b: nid, ruta:'neutro', lbl:'' });
      selNodo = nid; marcarSucio(); linking = null; hint(null); render(); return;
    }
    linking = null; hint(null); drawEdges(); return;
  }
  if (nodeD && !nodeD.movido){ undoStack.pop(); render(); } else if (nodeD && nodeD.movido) marcarSucio();
  nodeD = null; panD = null; vp.classList.remove('arrastrando');
});
vp.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY<0?1.08:1/1.08); }, {passive:false});
document.addEventListener('keydown', e => {
  if (e.key==='Escape'){ linking=null; relinking=null; hint(null); drawEdges(); }
  if ((e.ctrlKey||e.metaKey) && e.key==='z'){ e.preventDefault(); deshacer(); }
  if (e.key==='Delete' && (selNodo || selEdge!==null) && !document.activeElement.isContentEditable) borrarSel();
});
function _editarCampo(campo){
    const n = FLUJO.nodes.find(x=>x.id===campo.closest('.nodo').dataset.n);
    snapshot(); campo.contentEditable='true'; campo.focus();
    campo.onblur = () => {
      campo.contentEditable='false';
      if (campo.dataset.f === 'parte'){
        const pt = getPartes(n)[parseInt(campo.dataset.i)];
        if (pt && pt.txt !== campo.innerText){ pt.txt = campo.innerText; marcarSucio(); }
      } else if (n[campo.dataset.f] !== campo.innerText){ n[campo.dataset.f] = campo.innerText; marcarSucio(); }
      render();
    };
}
function editarNodo(id){
  const caja = nodoEl(id); if (!caja) return;
  const campo = caja.querySelector('.ptxt') || caja.querySelector('[data-f="nom"]');
  if (campo) _editarCampo(campo);
}
vp.addEventListener('dblclick', e => {
  if (MODO_VIEWER) return;
  const w = e.target.closest('.wire');
  if (w){ abrirEdicionEdge(parseInt(w.dataset.e)); return; }
  let campo = e.target.closest('[data-f]');
  if (!campo){
    let caja = e.target.closest('.nodo');
    if (!caja){
      /* FIX 04-ago: el pointer capture del drag hace que el dblclick llegue con target = viewport.
         Se localiza el box por coordenadas del mouse. */
      const wpt = toWorld(e);
      const n = FLUJO.nodes.find(n => wpt.x >= n.x && wpt.x <= n.x+NW && wpt.y >= n.y && wpt.y <= n.y+alto(n));
      if (n) caja = nodoEl(n.id);
    }
    if (caja) campo = caja.querySelector('.ptxt') || caja.querySelector('[data-f="nom"]');
  }
  if (campo) _editarCampo(campo);
});
function abrirEdicionEdge(i){
  const pos = {}; FLUJO.nodes.forEach(n=>pos[n.id]=n);
  const ed = FLUJO.edges[i], pth = pathFor(ed, pos); if (!pth) return;
  document.querySelectorAll('.eedit').forEach(x=>x.remove());
  const box = document.createElement('div'); box.className='eedit';
  box.style.left = (pth.mx-110)+'px'; box.style.top = (pth.my-18)+'px';
  const rutas = [['ok','var(--ok)'],['warn','var(--warn)'],['bad','var(--bad)'],['hum','var(--morado)'],['neutro','var(--etapa)']];
  box.innerHTML = `<input value="${(ed.lbl||'').replace(/"/g,'&quot;')}" placeholder="etiqueta (respuesta)">` +
    rutas.map(r=>`<span class="dot${ed.ruta===r[0]?' on':''}" data-r="${r[0]}" style="background:${r[1]}"></span>`).join('') +
    `<span style="cursor:pointer;font-weight:900;color:var(--ok)" data-okk="1">✓</span>`;
  world.appendChild(box);
  const inp = box.querySelector('input'); inp.focus();
  function guardarE(){ snapshot(); marcarSucio(); ed.lbl = inp.value; box.remove(); drawEdges(); }
  box.addEventListener('pointerdown', ev => {
    const d = ev.target.closest('.dot');
    if (d){ snapshot(); marcarSucio(); ed.ruta = d.dataset.r; box.querySelectorAll('.dot').forEach(x=>x.classList.toggle('on', x===d)); }
    if (ev.target.dataset.okk) guardarE();
    ev.stopPropagation();
  });
  inp.addEventListener('keydown', ev => { if (ev.key==='Enter') guardarE(); if (ev.key==='Escape') box.remove(); });
}
function nuevoBox(){
  snapshot();
  const r = vp.getBoundingClientRect();
  const cx = (r.width/2 - tx)/esc, cy = (r.height/2 - ty)/esc;
  const id = 'x'+Date.now().toString(36);
  marcarSucio(); FLUJO.nodes.push({ id, x:Math.round(cx/10)*10, y:Math.round(cy/10)*10, etapa:'(etapa)', nom:'Nuevo mensaje', own:B, msg:'doble clic para escribir…', sem:'a', tasa:'—' });
  selNodo = id; render(); document.getElementById('bBorrar').style.display='inline-block';
}
function borrarSel(){
  snapshot();
  marcarSucio(); if (selNodo){ FLUJO.nodes = FLUJO.nodes.filter(n=>n.id!==selNodo); FLUJO.edges = FLUJO.edges.filter(e=>e.a!==selNodo && e.b!==selNodo); selNodo=null; }
  else if (selEdge!==null){ FLUJO.edges.splice(selEdge,1); selEdge=null; }
  document.getElementById('bBorrar').style.display='none'; render();
}

/* ===== PERSISTENCIA ===== */
function estado(t){ document.getElementById('estadoGuardado').textContent = t; }
function guardarNube(){
  clearTimeout(autoT);
  const b = document.getElementById('bGuardarFlot');
  estado('guardando…'); b.textContent = '⏳ Guardando…';
  fetch(URL_GUARDAR, { method:'POST', body: JSON.stringify(FLUJO) })
    .then(r=>r.json()).then(()=>{
      estado('✅ guardado ' + new Date().toLocaleTimeString());
      b.textContent = '✅ Guardado'; b.classList.add('on');
      setTimeout(()=>{ b.style.display='none'; }, 1800);
    })
    .catch(()=>{ estado('⚠️ sin conexión — usa ⬇ JSON'); b.textContent='⚠️ Sin conexión (reintenta o ⬇ JSON)'; });
}
function cargarNube(){
  fetch(URL_CARGAR).then(r=>r.json()).then(d => {
    if (d && d.data && d.data.nodes && d.data.v === 7){ FLUJO = d.data; estado('☁️ versión guardada cargada'); render(); fitView(); }
    else if (d && d.data && d.data.nodes){ estado('☁️ había una versión antigua guardada — se usa la base v7 (guarda para actualizarla)'); }
    else estado('☁️ sin versión guardada (usando la base)');
  }).catch(()=>estado('☁️ sin conexión (usando la base)'));
}
function exportar(){
  const data = JSON.stringify(FLUJO, null, 1);
  navigator.clipboard && navigator.clipboard.writeText(data).catch(()=>{});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download='playbook-flujo.json'; a.click();
}
function importar(inp){
  const f = inp.files[0]; if (!f) return;
  f.text().then(t => { snapshot(); marcarSucio(); FLUJO = JSON.parse(t); render(); fitView(); }).catch(()=>alert('Archivo inválido'));
}

/* ===== VISTAS ===== */
function irVista(v){
  if (v==='general') v='detalle';
  ['bDetalle','bEmbudo','bEspera'].forEach(id=>{const b=document.getElementById(id); if(b) b.classList.remove('on');});
  document.getElementById(v==='embudo'?'bEmbudo':v==='espera'?'bEspera':'bDetalle').classList.add('on');
  vp.style.display = (v==='detalle')?'block':'none';
  document.getElementById('barra2').style.display = (v==='detalle')?'flex':'none';
  document.getElementById('vEmbudo').style.display = v==='embudo'?'block':'none';
  document.getElementById('vEspera').style.display = v==='espera'?'block':'none';
  document.getElementById('editBtns').style.display = (v==='detalle' && !MODO_VIEWER)?'flex':'none';
  if (v==='detalle'){
    render(); fitView();
    document.getElementById('miga').textContent = MODO_VIEWER ? 'Flujo de ventas — solo lectura' : 'doble clic = editar · arrastrar box = mover · ● arrastrar = conectar (al aire = box nuevo) · clic en box = mini-barra';
  }
  if (v==='embudo') cargarEmbudo();
  if (v==='espera') cargarEspera();
}

let espTimer = null;
function cargarEspera(){
  document.getElementById('espEstado').textContent = 'Consultando…';
  fetch(BASE_N8N + '/campana-espera').then(r=>r.json()).then(d=>{
    const es = (d && d.esperando) || [];
    document.getElementById('espEstado').textContent = 'Se actualiza sola cada 2 min · última: ' + new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
    const sem = m => m>15 ? 'var(--bad)' : m>=5 ? 'var(--warn)' : 'var(--ok)';
    document.getElementById('espLista').innerHTML = es.length===0
      ? '<div style="padding:34px;text-align:center;color:var(--txt2);border:1px dashed var(--bd);border-radius:12px">✅ Nadie está esperando — todo al día</div>'
      : es.map(e=>'<a href="'+e.url+'" target="_blank" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;text-decoration:none;color:inherit;background:var(--card)">'
          + '<span style="width:10px;height:10px;border-radius:50%;flex:none;background:'+sem(e.minutos)+'"></span>'
          + '<b style="flex:1">'+e.nombre+'</b>'
          + '<span style="font-weight:800;color:'+sem(e.minutos)+'">'+e.minutos+' min</span>'
          + '<span style="color:var(--txt2);font-size:12px">'+(e.asignada||'sin asesora')+'</span>'
          + '<span style="color:var(--txt2);font-size:12px">abrir en Chatwoot ↗</span></a>').join('');
  }).catch(()=>{ document.getElementById('espEstado').textContent = '⚠️ Sin conexión con el servicio de la campana'; });
  clearTimeout(espTimer);
  espTimer = setTimeout(()=>{ if (document.getElementById('vEspera').style.display !== 'none') cargarEspera(); }, 120000);
}

/* ===== EMBUDO 3D ===== */
let periodo = 'mtd';
function rango(){
  const ahora = new Date(); let d;
  if (periodo==='mtd') d = new Date(ahora.getFullYear(), ahora.getMonth(), 1);
  else if (periodo==='custom'){
    const pd = document.getElementById('pDesde').value, ph = document.getElementById('pHasta').value;
    if (pd && ph) return { desde: Math.floor(new Date(pd+'T00:00:00')/1000), hasta: Math.floor(new Date(ph+'T23:59:59')/1000), lbl: pd+' → '+ph };
    d = new Date(ahora - 30*86400000);
  } else d = new Date(ahora - parseInt(periodo)*86400000);
  return { desde: Math.floor(d/1000), hasta: Math.floor(ahora/1000), lbl: periodo==='mtd'?'mes hasta hoy':'últimos '+periodo+' días' };
}
function setPeriodo(p, btn){
  periodo = p;
  document.querySelectorAll('.periodos .btn[data-p]').forEach(b=>b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  cargarEmbudo();
}
function shade(col){ return `linear-gradient(90deg, rgba(0,0,0,.32), rgba(255,255,255,.28) 46%, rgba(255,255,255,.05) 54%, rgba(0,0,0,.36)), ${col}`; }
function pintarEmbudo(ac, nota){
  const filas = [
    {n:'FRÍAS', c:ac.frias, col:'var(--f-am)'}, {n:'TIBIAS', c:ac.tibias, col:'var(--f-na)'},
    {n:'CALIENTES', c:ac.calientes, col:'var(--f-ro)'}, {n:'COMPRAS', c:ac.compras, col:'var(--f-ve)'}
  ];
  /* frías/tibias en entero; calientes/compras con 1 decimal (son chicos y el decimal importa) */
  const pcts = filas.map((f,i) => !ac.frias ? 0 : (i<2 ? Math.round(f.c/ac.frias*100) : (Math.round(f.c/ac.frias*1000)/10).toFixed(1)));
  const trans = [
    {real: filas[0].c?Math.round(filas[1].c/filas[0].c*100):0, bench:BENCH.t1},
    {real: filas[1].c?Math.round(filas[2].c/filas[1].c*100):0, bench:BENCH.t2},
    {real: filas[2].c?Math.round(filas[3].c/filas[2].c*100):0, bench:BENCH.t3}
  ];
  let peor = 0, peorGap = -999;
  trans.forEach((t,i)=>{ const g = t.bench-t.real; if (g>peorGap){ peorGap=g; peor=i; } });
  const W = [100, 76, 52, 30];
  let h = `<div class="boca" style="width:100%;height:26px;background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(0,0,0,.25)), var(--f-am);margin-bottom:-14px"></div>`;
  filas.forEach((f, i) => {
    const wT = W[i], wB = i<3 ? W[i+1] : 12, inset = (wT-wB)/2/wT*100;
    h += `<div style="position:relative">` +
         `<div class="seg" style="width:${wT}%;height:96px;background:${shade(f.col)};clip-path:polygon(0 0,100% 0,${100-inset}% 100%,${inset}% 100%)">` +
         `<div class="inner"><div class="fpct">${pcts[i]}%</div><div class="fc">${f.c} conversaciones</div></div></div>` +
         `<div class="fizq" style="right:calc(${50+wT/2}% + 16px)">${f.n}</div></div>`;
    if (i<3){
      const t = trans[i], ok = t.real>=t.bench?'fok':'fbad';
      h += `<div class="ftrans">▼ pasa el <span class="${ok}">${t.real}%</span> · mercado ${t.bench}%` +
           (i===peor && peorGap>0 ? '<span class="ffuego">🔥 MAYOR OPORTUNIDAD</span>' : '') + `</div>`;
    }
  });
  h += `<div class="tubo"><div style="height:34px;background:${shade('var(--f-ve)')};border-radius:0 0 8px 8px"></div></div>`;
  const g = ac.frias ? Math.round(ac.compras/ac.frias*1000)/10 : 0;
  h += `<div class="ftrans" style="margin-top:14px">Conversión global: <b class="${g>=12?'fok':'fbad'}">${g}%</b> · mercado retail moda WhatsApp: ~12%</div>`;
  document.getElementById('embZona').innerHTML = h;
  document.getElementById('embEstado').textContent = nota;
}
function cargarEmbudo(){
  const r = rango();
  document.getElementById('embEstado').textContent = 'Leyendo la base de datos ('+r.lbl+')…';
  fetch(`${URL_EMBUDO}?desde=${r.desde}&hasta=${r.hasta}`).then(x=>x.json()).then(d => {
    pintarEmbudo(d.acumulado, `✅ Datos reales · ${r.lbl} · ${d.total} conversaciones · se actualiza cada noche a las 3am`);
  }).catch(() => {
    pintarEmbudo({frias:375, tibias:198, calientes:64, compras:12}, '⚠️ Sin conexión con el servicio. Datos de EJEMPLO.');
  });
}

render(); fitView(); cargarNube();
</script>

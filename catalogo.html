<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo Tulula</title>
<!-- 10-nov-2026 (Pablo) · PANEL DE CATALOGO para Chatwoot (Configuración › Integraciones › Panel de aplicaciones).
Chatwoot le pasa a esta página la conversación abierta. Al tocar Foto o Video de una prenda, n8n (webhook tulula-catalogo)
toma el archivo del ERP (Multimedia, canal BOT) y lo manda a la conversación. Nada se sube desde el equipo de la asesora. -->
<style>
:root{--bg:#fff;--tx:#1f1b17;--mu:#7a7268;--bd:#e6ded3;--ac:#8c6f4e;--ok:#15803d;--rd:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#1d1f24;--tx:#ece8e2;--mu:#a29a90;--bd:#33363d;--ac:#cbb79a;--ok:#4ade80;--rd:#f87171}}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 Manrope,system-ui,sans-serif;padding:12px}
h1{font-size:14px;font-weight:600;margin:0 0 4px}.n{color:var(--mu);font-size:12px;margin:0 0 8px}
#q{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);font:inherit;margin-bottom:8px}
#m{position:sticky;top:0;background:var(--bg);padding:6px 0;font-size:12px;min-height:18px;z-index:2}.ok{color:var(--ok)}.er{color:var(--rd)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.c{border:1px solid var(--bd);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px}
.c img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--bd)}
.c b{font-size:12px;font-weight:600;line-height:1.2}
.r{display:flex;gap:6px}
button{flex:1;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:8px;padding:6px 4px;font:inherit;font-size:12px;cursor:pointer}
button:hover{border-color:var(--ac)}button:disabled{opacity:.4;cursor:wait}
</style></head><body>
<h1>Catálogo Tulula</h1>
<p class="n" id="para">Abre una conversación para enviar.</p>
<input id="q" type="search" placeholder="Buscar prenda (ej. antonia, blusa, conjunto)">
<div id="m"></div>
<div class="g" id="g"></div>
<script>
const URL_N8N = 'https://n8n-production-4e716.up.railway.app/webhook/tulula-catalogo';
let CTX = null, ITEMS = [];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function msg(t, c) { $('m').className = c || ''; $('m').textContent = t; }
function titulo(s) { return String(s).toLowerCase().replace(/(^|[\s(+])([a-zñ])/g, (m, a, b) => a + b.toUpperCase()); }
function mini(u) { return /cdn\.shopify\.com/.test(u) ? u + (u.indexOf('?') >= 0 ? '&' : '?') + 'width=260' : u; }
window.addEventListener('message', e => {
  let d = e.data; try { if (typeof d === 'string') d = JSON.parse(d); } catch (_) { return; }
  if (!d || d.event !== 'appContext' || !d.data) return;
  CTX = d.data;
  const c = CTX.contact || {}, cv = CTX.conversation || {};
  $('para').textContent = cv.id ? ('Para: ' + (c.name || c.phone_number || 'clienta') + ' · conversación #' + cv.id) : 'Abre una conversación para enviar.';
});
function pedirContexto() { try { window.parent.postMessage('chatwoot-dashboard-app:fetch-info', '*'); } catch (_) {} }
pedirContexto();
function pintar() {
  const q = $('q').value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
  const L = ITEMS.filter(x => !q || (x.diseno + ' ' + (x.categoria || '')).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').indexOf(q) >= 0);
  $('g').innerHTML = L.map(x => '<div class="c">' + (x.foto ? '<img loading="lazy" src="' + esc(mini(x.foto)) + '" alt="">' : '') + '<b>' + esc(titulo(x.diseno)) + '</b><div class="r">' +
    (x.foto ? '<button data-d="' + esc(x.diseno) + '" data-t="foto">📷 Foto</button>' : '') +
    (x.video ? '<button data-d="' + esc(x.diseno) + '" data-t="video">🎬 Video</button>' : '') + '</div></div>').join('') || '<p class="n">Sin resultados.</p>';
  $('g').querySelectorAll('button').forEach(enganchar);
}
function enganchar(b) { b.addEventListener('click', async () => {
  const cv = CTX && CTX.conversation;
  if (!cv || !cv.id) { msg('Abre primero una conversación.', 'er'); pedirContexto(); return; }
  if (cv.can_reply === false) { msg('Pasaron más de 24 h desde el último mensaje de la clienta: WhatsApp solo deja enviar una plantilla.', 'er'); return; }
  const todos = document.querySelectorAll('button'); todos.forEach(x => x.disabled = true);
  const que = (b.dataset.t === 'video' ? 'video' : 'foto') + ' de ' + titulo(b.dataset.d);
  msg('Enviando ' + que + '…');
  try {
    const r = await fetch(URL_N8N, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ conversacion: cv.id, diseno: b.dataset.d, tipo: b.dataset.t, agente: (CTX.currentAgent && CTX.currentAgent.name) || '' }) });
    const j = await r.json().catch(() => ({}));
    if (j.ok) msg('✓ Enviado: ' + que, 'ok'); else msg('No se envió: ' + (j.mensaje || ('error ' + r.status)), 'er');
  } catch (e) { msg('No se envió: sin conexión con n8n', 'er'); }
  todos.forEach(x => x.disabled = false);
}); }
$('q').addEventListener('input', pintar);
msg('Cargando catálogo…');
fetch(URL_N8N, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ accion: 'lista' }) }).then(r => r.json()).then(j => {
  ITEMS = (j && j.items) || []; msg(ITEMS.length ? '' : 'El catálogo está vacío.', ITEMS.length ? '' : 'er'); pintar();
}).catch(() => msg('No se pudo cargar el catálogo (n8n no respondió).', 'er'));
</script></body></html>

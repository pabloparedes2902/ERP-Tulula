/* 21-oct-2026 · 🧵 PRODUCCIÓN · Fase 1 (pedido de Pablo). Una orden = un lote de un producto de 📦 Productos (una sola fuente).
   Camino: Nuevo = Diseño → Muestra → Molde → Tela → Escalado → Corte y confección → Entrega → Calidad → Inventario → Fotos → Venta
           Reposición = Tela → Corte y confección → Entrega → Calidad → Inventario → Venta
   Entregas con fallas: buena (va al stock) · falla (va a corrección) · corregida (vuelve arreglada) · perdida (sin arreglo, con motivo). */
:root{--bg:#12161f;--panel:#1a2130;--card:#232b3b;--bd:#37455f;--tx:#e7ecf5;--mu:#93a1b8;--ac:#7c5cff;--ok:#22c55e;--am:#f59e0b;--rd:#ef4444}
body.light{--bg:#eef1f6;--panel:#fff;--card:#fff;--bd:#c8d3e2;--tx:#1b2330;--mu:#5c6b82}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 var(--ui-f)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 11px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:5px 8px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;height:54px;position:sticky;top:0;background:var(--bg);z-index:3;border-bottom:1px solid var(--bd)}
.top h1{font-size:20px;font-weight:600;margin:0 8px 0 0}.sp{flex:1}.mu{color:var(--mu)}.err{color:var(--rd)}.okt{color:var(--ok)}
.tablero{display:flex;gap:10px;overflow-x:auto;padding:12px 14px;align-items:flex-start}
.col{flex:0 0 230px;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:8px}
.col h3{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:-8px -8px 8px;padding:9px 10px 7px;display:flex;justify-content:space-between;gap:6px;position:sticky;top:54px;background:var(--panel);border-bottom:1px solid var(--bd);border-radius:12px 12px 0 0;z-index:2}
.col h3 small{display:block;font-size:12px;letter-spacing:0;text-transform:none;color:var(--mu);font-weight:500;margin-top:2px}
.col h3 .n{min-width:22px;height:22px;border-radius:11px;background:var(--bd);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.col.vacia{opacity:.55}.col .nada{font-size:12px;color:var(--mu);text-align:center;padding:14px 4px}
/* 21-oct (Pablo) · vista «📍 Dónde está cada orden»: una fila por orden y una columna fija por etapa (como un mapa de metro) */
.lin{padding:0 14px 30px;overflow:auto;height:calc(100vh - 54px)}   /* 21-oct · un solo contenedor con scroll: el encabezado y la columna de la prenda quedan fijos */
.lin .g2{display:grid;grid-template-columns:330px repeat(8,minmax(84px,1fr)) 200px;min-width:1210px;align-items:center}
.lin .cab{position:sticky;top:0;z-index:3;background:var(--bg);padding:6px 0 5px;border-bottom:2px solid var(--bd)}
.lin .cab > div:first-child,.lin .nom{position:sticky;left:0;z-index:2;background:var(--bg);align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding-right:8px}
.lin .cab > div:first-child{z-index:4}
.lin .fila:hover .nom{background:var(--panel)}
.lin .cab .st{text-align:center;font-size:11px;line-height:1.25;padding:0 2px}
.lin .cab .st b{display:block;font-size:11px;font-weight:500;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.lin .cab .st .q{color:var(--mu)}
.lin .cab .st .c{display:inline-block;margin-top:3px;min-width:20px;padding:1px 6px;border-radius:9px;background:var(--bd);font-size:11px}
.lin .cab .st .c.on{background:var(--ac);color:#fff}
.lin .fila{border-bottom:1px solid var(--bd);padding:2px 0;cursor:pointer}
/* 26-oct (Pablo) · una sola línea por orden: Producto · Listas · Entrega */
.lin .nom.uno,.lin .cab .hn{flex-direction:row!important;align-items:center;gap:6px}.lin .nom.uno b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.lin .ls,.lin .en{flex:0 0 58px;text-align:center;font-size:12px;white-space:nowrap}.lin .nom.uno .ls{color:var(--tx)}.lin .nom.uno .en.rd{color:var(--rd);font-weight:600}
.lin .cab .hn span{font-size:11px;font-weight:500;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.lin .fila.arr{opacity:.4}.lin .fila.sobre{box-shadow:inset 0 3px 0 var(--ac)}
.lin .nom .asa{cursor:grab;color:var(--mu);margin-right:4px;user-select:none}
.lin .fila:hover{background:var(--panel)}
.lin .nom b{display:block;font-size:13px;font-weight:600}.lin .nom span{font-size:12px;color:var(--mu)}
.lin .pt{position:relative;height:26px;display:flex;align-items:center;justify-content:center}
.lin .pt:before,.lin .pt:after{content:'';position:absolute;top:50%;height:3px;transform:translateY(-50%);width:50%}
.lin .pt:before{left:0;background:var(--l,var(--bd))}.lin .pt:after{right:0;background:var(--r,var(--bd))}
.lin .pt.na:before,.lin .pt.na:after{background:repeating-linear-gradient(90deg,var(--bd) 0 4px,transparent 4px 8px)}
.lin .pt i{cursor:pointer;z-index:1}.lin .pt.na i{cursor:default}
.lin .pt.p i{width:22px;height:22px;background:#facc15;box-shadow:0 0 0 4px rgba(250,204,21,.25)}
.lin .pt.p.rd i{background:var(--rd);box-shadow:0 0 0 4px rgba(239,68,68,.25)}
.pt.p.ok i{background:var(--ok);box-shadow:0 0 0 4px rgba(34,197,94,.25)}.pt.p.am i{background:#facc15}
.pt[data-tip]:hover:after{content:attr(data-tip);position:absolute;bottom:115%;left:50%;transform:translateX(-50%);width:max-content;max-width:260px;white-space:normal;background:#111827;color:#fff;font-size:12px;line-height:1.35;padding:6px 9px;border-radius:8px;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.35);height:auto;top:auto;right:auto;pointer-events:none}
.et{cursor:pointer;user-select:none}.et.proc{background:#facc15;color:#1b2330;border-color:#facc15;font-weight:600}.et.proc.tarde{background:var(--rd);color:#fff;border-color:var(--rd)}
.lin .pt i{position:relative;width:12px;height:12px;border-radius:50%;background:var(--bd);border:2px solid var(--bg)}
.lin .pt.h i{background:var(--ok)}.lin .pt.na i{width:6px;height:6px;opacity:.5}
.lin .nec{font-size:11px;line-height:1.5}
.lin .ley{font-size:12px;color:var(--mu);margin:10px 0 0;display:flex;gap:14px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 9px;margin-bottom:7px;cursor:pointer;border-left:4px solid var(--ok)}
.card.am{border-left-color:var(--am)}.card.rd{border-left-color:var(--rd)}.card:hover{border-color:var(--ac)}
.card b{display:block;font-size:13px;font-weight:600}.card .l{font-size:12px;color:var(--mu)}
.bar{height:5px;border-radius:4px;background:var(--bd);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;background:var(--bd);margin-right:4px}
.chip.am{background:rgba(245,158,11,.2);color:var(--am)}.chip.rd{background:rgba(239,68,68,.18);color:var(--rd)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;z-index:9;overflow:auto;padding:30px 10px}
.box{background:var(--panel);border:1px solid var(--bd);border-radius:14px;width:min(880px,100%);padding:16px;position:relative}
/* 26-oct (Pablo) · ficha y nueva producción del ancho de la pantalla; una línea por fila; números centrados */
#mOrden .box,#mNueva .box{width:calc(100vw - 20px);max-width:none}#mOrden.modal,#mNueva.modal{padding:10px}
table.g td{vertical-align:middle;white-space:nowrap}table.g td small{display:inline;margin-left:3px;font-size:11px}table.g td.iS,table.g td.iTS{min-width:96px}
.f input[type=number],.box input[type=number]{text-align:center}
.otabs{display:flex;gap:6px;margin:8px 0 4px;border-bottom:1px solid var(--bd);padding-bottom:6px}.otabs button{border-radius:20px;font-size:12px;padding:4px 12px}.otabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.opane{display:none}.opane.on{display:block}
.box h2{font-size:20px;font-weight:600;margin:0 30px 10px 0}.x{position:absolute;top:10px;right:10px;border:0;background:transparent;font-size:18px;color:var(--mu)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 10px;margin-bottom:10px}.f label{font-size:11px;color:var(--mu);display:block;margin-bottom:2px}.f input,.f select{width:100%}
table.g{border-collapse:collapse;margin:6px 0;font-size:13px}table.g th{font-size:11px;font-weight:500;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}table.g th,table.g td{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:center}
table.g th:first-child,table.g td:first-child{text-align:left}table.g th small{display:block;font-weight:400;color:var(--mu);font-size:11px;text-transform:none;letter-spacing:0}table.g input{width:48px;text-align:center;padding:3px}
table.g td.ag{background:rgba(239,68,68,.12)}table.g.lote{margin:4px 0 8px}table.g.lote input[type=number]{width:46px}table.g small{display:block;color:var(--mu);font-size:12px}
.camino{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 12px}.et{font-size:11px;padding:4px 8px;border-radius:8px;border:1px solid var(--bd);color:var(--mu)}
.et.hecha{color:var(--ok);border-color:rgba(34,197,94,.4)}.et.act{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}.et.tarde{border-color:var(--rd)}
.res{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}.res div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;text-align:center;font-size:11px;font-weight:500;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}.res b{font-size:22px;font-weight:600;display:block;text-transform:none;letter-spacing:0}.res b:not([class]){color:var(--tx)}
.sec{margin-top:14px;border-top:1px solid var(--bd);padding-top:10px}.sec h4{margin:0 0 6px;font-size:14px;font-weight:600}
.vacio{padding:40px;text-align:center;color:var(--mu)}

/* ── saldos de una orden por color × talla: pedidas · listas (buenas + corregidas) · en corrección · perdidas · faltan entregar ── */
function saldos(o){
  const L = D.lineas.filter(x => x.orden_id === o.id), M = D.movs.filter(x => x.orden_id === o.id), k = (c, t) => c + '|' + t, S = {};
  const nuevo = (c, t) => ({ color:c, talla:t, pedido:0, buena:0, falla:0, corregida:0, perdida:0, yayita:0 });
  L.forEach(x => { S[k(x.color, x.talla)] = Object.assign(nuevo(x.color, x.talla), { pedido:x.pedido }); });
  M.forEach(x => { const s = S[k(x.color, x.talla)] || (S[k(x.color, x.talla)] = nuevo(x.color, x.talla)); s[x.tipo] += x.cantidad; });
  const T = { pedido:0, buenas:0, correccion:0, perdidas:0, yayitas:0, falta:0, porIngresar:0 };
  M.forEach(x => { if (!x.ingresado && ['buena', 'corregida', 'yayita'].indexOf(x.tipo) >= 0) T.porIngresar += x.cantidad; });
  Object.values(S).forEach(s => { s.buenas = s.buena + s.corregida; s.correccion = Math.max(0, s.falla - s.corregida - s.perdida - s.yayita); s.perdidas = s.perdida; s.yayitas = s.yayita;   /* 21-oct F1b · yayita = falla sin arreglo que se vende barata */
    s.falta = Math.max(0, s.pedido - s.buenas - s.correccion - s.perdidas - s.yayitas);
    T.pedido += s.pedido; T.buenas += s.buenas; T.correccion += s.correccion; T.perdidas += s.perdidas; T.yayitas += s.yayitas; T.falta += s.falta; });
  return { S, T };
}
/* ── fechas objetivo: hacia atrás desde «a la venta el». F[etapa] = día en que esa etapa tiene que estar TERMINADA ── */
function fechas(o){
  const C = CAMINO[o.tipo] || CAMINO.reposicion, F = {}; if (!o.fecha_venta) return F;
  let d = new Date(o.fecha_venta + 'T00:00:00');
  for (let i = C.length - 1; i >= 0; i--){ F[C[i]] = new Date(d); d = new Date(d.getTime() - (ETAPAS[C[i]][2] || 0) * 864e5); }
  return F;
}
const hoy0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const fTxt = d => d ? d.toLocaleDateString('es-PE', { day:'numeric', month:'short' }).replace('.', '') : '—';
function estadoFecha(o){
  /* 21-oct (Pablo) · un solo plazo para todo el producto: la fecha en que tiene que estar a la venta */
  if (!o.fecha_venta || o.cerrada || o.etapa === 'venta') return { col:'', txt:'' };
  const n = Math.round((new Date(o.fecha_venta + 'T00:00:00') - hoy0()) / 864e5);
  return n < 0 ? { col:'rd', txt:'atrasada ' + (-n) + ' d' } : { col:'', txt:'a la venta el ' + fTxt(new Date(o.fecha_venta + 'T00:00:00')) + ' · faltan ' + n + ' d' };
}

        + '<div class="l">' + T.buenas + '/' + T.pedido + ' listas' + (o.fecha_venta ? ' · ' + fTxt(new Date(o.fecha_venta + 'T00:00:00')) : '') + (T.correccion ? ' · <span class="chip am">' + T.correccion + ' en corrección</span>' : '') + (T.perdidas ? ' <span class="chip rd">' + T.perdidas + ' perdidas</span>' : '') + (T.yayitas ? ' <span class="chip">' + T.yayitas + ' yayitas</span>' : '') + '</div>'

        + (T.porIngresar ? '<div class="l"><span class="chip am">📦 ' + T.porIngresar + ' por ingresar al stock</span></div>' : '')
        + (ef.col === 'rd' ? '<div class="l"><span class="chip rd">' + ef.txt + '</span></div>' : '') + '</div>'; }).join('') + '</div>';
  }).join('');

/* ── nueva orden: el producto sale de la lista de Stock/Productos; en reposición se ve lo que hay y lo vendido en 90 días ── */
async function cargarStock(){
  if (D.stock) return D.stock;
  try { const j = await rpc('mk_escalamiento_stock'); D.stock = (j && j.filas) || []; } catch (e) { D.stock = []; }
  document.getElementById('lDis').innerHTML = [...new Set(D.stock.map(x => nrm(x.p + ' ' + x.d)).concat(Object.keys(D.prod || {})))].sort().map(x => '<option value="' + esc(x) + '">').join('');
  return D.stock;
}

  document.getElementById('nFTal').value = o ? (o.fecha_taller || '') : ''; document.getElementById('nDias').value = o && o.dias_taller != null ? o.dias_taller : '';

  if (D.lreal === undefined){ try { D.lreal = await rpc('prod_lead_real'); } catch (_) { D.lreal = null; } }   /* 24-oct · duración real */
  NV.fechaMano = !!(o && o.fecha_venta); nFechaSug();

/* 24-oct (Pablo: OK «fecha para venta» automática) · al crear: hoy + días del camino (Reposición: tela 3 + confección 10 + entrega 1 + calidad 2 = 16;
   si se ponen los días de confección del taller, se usan esos). Si Ana la cambia a mano, se respeta. Sin fecha no se guarda. */
function nFechaDias(){ const tipo = document.getElementById('nTipo').value, di = document.getElementById('nDias').value;
  /* 24-oct · si ya hay duración real medida (de esta prenda, o de la tienda con 2+ pedidos) y no se pusieron días del taller, se usa esa */
  const R = D.lreal, k = nrm(document.getElementById('nDis').value);
  if (R && di === '' && tipo === 'reposicion'){ const pp = R.por_prenda || {}, m = Object.keys(pp).find(x => nrm(x) === k);
    if (m && +pp[m].dias > 0){ NV.fuente = 'lo que tardaron sus últimos pedidos'; return +pp[m].dias; }
    if (R.tienda && +R.tienda.n >= 2 && +R.tienda.dias > 0){ NV.fuente = 'lo que tardan los pedidos de la tienda'; return +R.tienda.dias; } }
  NV.fuente = 'días del camino';
  return (CAMINO[tipo] || CAMINO.reposicion).reduce((a, e) => a + (e === 'corte' && di !== '' && !isNaN(+di) ? +di : (ETAPAS[e][2] || 0)), 0); }
function nFechaSug(){
  const el = document.getElementById('nFecha'), ay = document.getElementById('nFechaSug'); if (!el) return;
  const n = nFechaDias(), d = new Date(hoy0().getTime() + n * 864e5), iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  if (!NV.fechaMano || !el.value){ el.value = iso; NV.fechaMano = false; }
  if (ay) ay.textContent = NV.fechaMano && el.value !== iso ? 'Sugerida: ' + fTxt(d) + ' (hoy + ' + n + ' días)' : 'Hoy + ' + n + ' días: ' + (NV.fuente || 'días del camino') + ' (se puede cambiar)';
}
/* 24-oct · pedido nuevo lleno desde 🚀 Escalamiento (el cálculo propone, Ana revisa y guarda) */
async function nuevaDesdeEscala(Px){

  await abrirNueva(null);
  document.getElementById('nDis').value = P.diseno; document.getElementById('nTipo').value = 'reposicion';
  NV.colores = (P.colores || []).slice(); NV.q = Object.assign({}, P.q || {});
  nProducto(true); nFechaSug();
  const n = document.getElementById('nNotas'); if (n && !n.value) n.value = 'Cantidades sugeridas por ' + (P.origen || 'Escalamiento') + ' (revisar antes de guardar).';
  return true;
}
/* 25-oct (Pablo: OK tope de compra del mes, sugerido y editable por Ana) · OPEN-TO-BUY como los referentes:
   compra del mes = ventas planeadas a costo + stock que se quiere tener al cierre − stock de hoy − lo ya pedido.
   Para mantener el inventario parejo (cierre = inicio) queda: COMPRAR LO QUE SE VENDE. Sugerido = lo vendido en las últimas 4 semanas
   (prendas, sin complementos), llevado a 30 días y a costo de 📦 Productos. Usado = pedidos creados este mes × su costo. */
const PROD_TOPE_DESDE = '2026-10-23';
const COMPLEMENTOS = ['ARETE', 'ANILLO', 'COLLAR', 'PULSERA', 'INTERIOR', 'CORREA', 'COLETS', 'PAÑUELO'];
const costoDe = d => { const p = D.prod && D.prod[nrm(d)]; return p && p.costo_unitario != null ? +p.costo_unitario : null; };
const soles = n => 'S/ ' + Math.round(n || 0).toLocaleString('es-PE');
function topeCalc(){
  if (!D.prod) return null;
  const hoy = new Date(), mes = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0');
  let sug = 0, sinCosto = 0;
  (D.stock || []).forEach(x => { if (COMPLEMENTOS.includes(String(x.p).toUpperCase())) return; const c = costoDe(x.p + ' ' + x.d), v = (x.x || []).reduce((a, r) => a + (+r[3] || 0), 0);
    if (!v) return; if (c == null){ sinCosto++; return; } sug += v * 30 / 28 * c; });
  let usado = 0, n = 0;
  /* los pedidos que se pasaron del Drive el 21 y 22 de octubre no cuentan como compras del mes: el tope corre desde el 23-oct */
  D.ordenes.filter(o => String(o.creado || '').slice(0, 7) === mes && String(o.creado || '').slice(0, 10) >= PROD_TOPE_DESDE).forEach(o => { const c = costoDe(o.diseno); n++;
    D.lineas.filter(l => l.orden_id === o.id).forEach(l => { usado += (+l.pedido || 0) * (c || 0); }); });
  const tope = D.param.tope_compra_mes > 0 ? +D.param.tope_compra_mes : null, sugR = Math.round(sug / 500) * 500;
  return { mes, tope, sug: sugR, usado: Math.round(usado), n, queda: (tope || sugR) - Math.round(usado), sinCosto };
}
async function topePintar(){
  const el = document.getElementById('topeBar'); if (!el) return;
  try { await cargarStock(); } catch (_) {}
  const T = topeCalc(); if (!T){ el.innerHTML = ''; return; }
  const mesTxt = new Date().toLocaleDateString('es-PE', { month:'long' }), base = T.tope || T.sug;
  el.innerHTML = '💰 <b>Tope de compra de ' + mesTxt + ':</b> S/ <input id="topeIn" type="number" min="0" step="500" style="width:100px" value="' + (T.tope || T.sug) + '"> <button onclick="topeGuardar()">Guardar</button> <span id="topeMsg" class="mu"></span>'
    + ' · <span class="mu" title="Lo vendido en las últimas 4 semanas (prendas, sin complementos), llevado a 30 días y a costo de 📦 Productos: comprar lo que se vende mantiene el inventario parejo">sugerido ' + soles(T.sug) + (T.tope ? '' : ' (en uso)') + '</span>'
    + ' · usado ' + soles(T.usado) + ' en ' + T.n + ' pedido' + (T.n === 1 ? '' : 's') + ' de este mes · <b style="color:' + (T.queda < 0 ? 'var(--rd)' : 'var(--ok)') + '">' + (T.queda < 0 ? 'se pasó por ' + soles(-T.queda) : 'queda ' + soles(T.queda)) + '</b>';
  try { localStorage.setItem('prod_tope_v1', JSON.stringify({ mes: T.mes, tope: base, sug: T.sug, usado: T.usado, queda: T.queda, at: Date.now() })); } catch (_) {}
}

    let pend = s.correccion; F.forEach(x => { const k = Math.min(pend, x.cantidad); pend -= k; if (k > 0 && new Date(x.fecha + 'T00:00:00').getTime() < lim) n += k; }); });
  return n;
}

  if (!pr || pr.costo_unitario == null) return '';   /* costos: solo administración */
  const nom = Object.fromEntries(COMPS), S = x => (+x.cantidad || 0) * (+x.precio || 0);
  return '<div style="margin-top:12px"><b style="font-size:14px;font-weight:600">Costo por prenda (📦 Productos): S/ ' + (+pr.costo_unitario).toFixed(2) + '</b>'
    + (L.length ? '<table class="g" style="width:100%"><tr><th>Componente</th><th>Material / proveedor</th><th>Cant.</th><th>Unidad</th><th>Precio</th><th>Subtotal</th></tr>'
        + L.map(x => '<tr><td>' + esc(nom[x.comp] || x.comp) + '</td><td>' + esc(x.descripcion || '') + '</td><td>' + (+x.cantidad) + '</td><td>' + esc(x.unidad || '') + '</td><td>' + S2(x.precio) + '</td><td>' + S2(S(x)) + '</td></tr>').join('') + '</table>'
      : '')
    + '<button type="button" data-n="' + esc(d) + '" onclick="parent.prodAbrirProducto && parent.prodAbrirProducto(this.dataset.n)">📦 Abrir la ficha del producto</button></div>';
}
async function firmar(rutas){
  const faltan = rutas.filter(r => !D.urls[r]); if (!faltan.length) return;
  try { const r = await fetch(SB + '/storage/v1/object/sign/produccion', { method:'POST', headers:{ apikey:ANON, Authorization:'Bearer ' + tok(), 'Content-Type':'application/json' }, body: JSON.stringify({ expiresIn: 600, paths: faltan }) });
    const j = await r.json(); (Array.isArray(j) ? j : []).forEach(x => { const u = x.signedURL || x.signedUrl; if (u && x.path) D.urls[x.path] = SB + '/storage/v1' + u; }); } catch (_) {}
}
async function firmarFicha(o){
  const imgs = [...document.querySelectorAll('#oCuerpo img[data-ruta]')]; if (!imgs.length) return;
  await firmar(imgs.map(i => i.dataset.ruta)); imgs.forEach(i => { if (D.urls[i.dataset.ruta]) i.src = D.urls[i.dataset.ruta]; });
}
async function verArchivo(ruta){ await firmar([ruta]); if (D.urls[ruta]) window.open(D.urls[ruta], '_blank'); else aviso('No se pudo abrir el archivo'); }
async function subirFicha(inp, tipo){
  const files = [...inp.files], msg = document.getElementById('fMsg-' + tipo), d = nrm(OA.diseno), slug = d.replace(/[^A-Z0-9]+/g, '-');
  if (!files.length) return; let ok = 0;
  for (const f of files){
    if (f.size > 25 * 1024 * 1024){ msg.textContent = '«' + f.name + '» pesa más de 25 MB'; continue; }
    msg.textContent = 'Subiendo ' + (ok + 1) + ' de ' + files.length + '…';
    const ruta = slug + '/' + tipo + '/' + Date.now() + '_' + f.name.replace(/[^\w.\-]+/g, '_');
    try {
      const r = await fetch(SB + '/storage/v1/object/produccion/' + ruta, { method:'POST', headers:{ apikey:ANON, Authorization:'Bearer ' + tok(), 'Content-Type': f.type || 'application/octet-stream' }, body: f });
      if (!r.ok) throw new Error('no se pudo subir (' + r.status + ')');
      const g = await rpc('prod_archivo_guardar', { p_diseno:d, p_tipo:tipo, p_ruta:ruta, p_nombre:f.name, p_mime:f.type || '' }); if (!g.ok) throw new Error(g.error);
      ok++;
    } catch (e) { msg.textContent = '«' + f.name + '»: ' + e.message; }
  }
  await cargar(); abrirOrden(OA.id);
}
async function borrarArchivo(id){
  try { const r = await rpc('prod_archivo_borrar', { p_arch:id }); if (!r.ok) throw new Error(r.error || 'No se pudo');
    if (r.ruta) await fetch(SB + '/storage/v1/object/produccion/' + r.ruta, { method:'DELETE', headers:{ apikey:ANON, Authorization:'Bearer ' + tok() } }).catch(() => {});
    await cargar(); abrirOrden(OA.id); } catch (e) { aviso(e.message); }
}
function aviso(t){ const m = document.getElementById('msg'); m.textContent = t; m.className = 'err'; setTimeout(() => { m.textContent = ''; m.className = 'mu'; }, 6000); }
function cerrar(id){ if (id === 'mNueva' && typeof EN_ORDEN !== 'undefined' && EN_ORDEN){ volverDeEditar(); return; } if (id === 'mOrden' && typeof EN_ORDEN !== 'undefined' && EN_ORDEN) volverDeEditar(); document.getElementById(id).style.display = 'none'; }
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (document.getElementById('mConf').style.display === 'flex'){ cerrar('mConf'); return; } cerrar('mNueva'); cerrar('mOrden'); } });
window.addEventListener('message', e => { const m = e && e.data; if (m && m.tipo === 'prod-prefill') { nuevaDesdeEscala(m.P); return; } if (m && m.tipo === 'erp-tema') document.body.classList.toggle('light', !!m.light);
  if (m && m.tipo === 'prod-recalcular') cargar();   /* 21-oct · Alertas pide la foto al día */
  if (m && m.tipo === 'erp-refrescar'){ try { e.source.postMessage({ tipo:'erp-refrescar-ok' }, '*'); } catch (_) {} cargar(); } });
try { if (parent !== window) parent.postMessage({ tipo:'erp-tema-pedir' }, '*'); } catch (e) {}
if (typeof process === 'undefined') cargar();
</script></body></html>

<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producción · Tulula</title>
<style>
/* 21-oct-2026 · 🧵 PRODUCCIÓN · Fase 1 (pedido de Pablo). Una orden = un lote de un producto de 📦 Productos (una sola fuente).
   Camino: Nuevo = Diseño → Muestra → Molde → Tela → Escalado → Corte y confección → Entrega → Calidad → Inventario → Fotos → Venta
           Reposición = Tela → Corte y confección → Entrega → Calidad → Inventario → Venta
   Entregas con fallas: buena (va al stock) · falla (va a corrección) · corregida (vuelve arreglada) · perdida (sin arreglo, con motivo). */
:root{--bg:#12161f;--panel:#1a2130;--card:#232b3b;--bd:#37455f;--tx:#e7ecf5;--mu:#93a1b8;--ac:#7c5cff;--ok:#22c55e;--am:#f59e0b;--rd:#ef4444}
body.light{--bg:#eef1f6;--panel:#fff;--card:#fff;--bd:#c8d3e2;--tx:#1b2330;--mu:#5c6b82}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 11px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:5px 8px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;position:sticky;top:0;background:var(--bg);z-index:3;border-bottom:1px solid var(--bd)}
.top h1{font-size:16px;margin:0 8px 0 0}.sp{flex:1}.mu{color:var(--mu)}.err{color:var(--rd)}.okt{color:var(--ok)}
.tablero{display:flex;gap:10px;overflow-x:auto;padding:12px 14px;align-items:flex-start}
.col{flex:0 0 230px;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:8px}
.col h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:2px 4px 8px;display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 9px;margin-bottom:7px;cursor:pointer;border-left:4px solid var(--ok)}
.card.am{border-left-color:var(--am)}.card.rd{border-left-color:var(--rd)}.card:hover{border-color:var(--ac)}
.card b{display:block;font-size:13px}.card .l{font-size:11.5px;color:var(--mu)}
.bar{height:5px;border-radius:4px;background:var(--bd);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.chip{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:9px;background:var(--bd);margin-right:4px}
.chip.am{background:rgba(245,158,11,.2);color:var(--am)}.chip.rd{background:rgba(239,68,68,.18);color:var(--rd)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;z-index:9;overflow:auto;padding:30px 10px}
.box{background:var(--panel);border:1px solid var(--bd);border-radius:14px;width:min(880px,100%);padding:16px;position:relative}
.box h2{font-size:16px;margin:0 30px 10px 0}.x{position:absolute;top:10px;right:10px;border:0;background:transparent;font-size:18px;color:var(--mu)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 10px;margin-bottom:10px}.f label{font-size:11px;color:var(--mu);display:block;margin-bottom:2px}.f input,.f select{width:100%}
table.g{border-collapse:collapse;margin:6px 0;font-size:12px}table.g th,table.g td{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:center}
table.g th:first-child,table.g td:first-child{text-align:left}table.g input{width:48px;text-align:center;padding:3px}
table.g td.ag{background:rgba(239,68,68,.12)}table.g small{display:block;color:var(--mu);font-size:10px}
.camino{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 12px}.et{font-size:11px;padding:4px 8px;border-radius:8px;border:1px solid var(--bd);color:var(--mu)}
.et.hecha{color:var(--ok);border-color:rgba(34,197,94,.4)}.et.act{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}.et.tarde{border-color:var(--rd)}
.res{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}.res div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 10px}.res b{font-size:16px;display:block}
.sec{margin-top:14px;border-top:1px solid var(--bd);padding-top:10px}.sec h4{margin:0 0 6px;font-size:13px}
.vacio{padding:40px;text-align:center;color:var(--mu)}
</style></head><body>
<div class="top"><h1>🧵 Producción</h1>
  <select id="fVer" onchange="pintar()"><option value="curso">En curso</option><option value="cerradas">Cerradas</option></select>
  <select id="fTaller" onchange="pintar()"><option value="">Todos los talleres</option></select>
  <span class="sp"></span><span id="msg" class="mu"></span>
  <button class="p" id="btnNueva" onclick="abrirNueva()">＋ Nueva orden</button>
</div>
<div id="tablero" class="tablero"><div class="vacio">Cargando…</div></div>

<div id="mNueva" class="modal" onclick="if(event.target===this)cerrar('mNueva')"><div class="box">
  <button class="x" title="Cerrar" onclick="cerrar('mNueva')">✕</button><h2 id="nTit">＋ Nueva orden de producción</h2>
  <div class="f">
    <div><label>Producto (de 📦 Productos)</label><input id="nDis" list="lDis" placeholder="BLAZER MIRELLA" oninput="nProducto()"><datalist id="lDis"></datalist></div>
    <div><label>Tipo</label><select id="nTipo"><option value="reposicion">Reposición</option><option value="nuevo">Nuevo</option></select></div>
    <div><label>Taller</label><input id="nTaller" list="lTaller"><datalist id="lTaller"></datalist></div>
    <div><label>Tela - proveedor</label><input id="nTela" placeholder="Mirella - Colortex"></div>
    <div><label>A la venta el</label><input id="nFecha" type="date"></div>
    <div><label>Costo por prenda (S/)</label><input id="nCosto" type="number" step="0.5" min="0"></div>
  </div>
  <div class="mu" id="nAyuda" style="font-size:11.5px"></div>
  <div id="nGrid"></div>
  <div style="display:flex;gap:6px;align-items:center;margin-top:6px"><input id="nColor" placeholder="Agregar color" style="width:150px"><button onclick="nAgregarColor()">＋ Color</button><span class="sp"></span>
    <span class="mu" id="nTot"></span></div>
  <div class="f" style="margin-top:8px"><div style="grid-column:1/-1"><label>Notas</label><input id="nNotas"></div></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><span id="nMsg" class="err"></span><button onclick="cerrar('mNueva')">Cancelar</button><button class="p" id="nOk" onclick="guardarOrden()">Guardar orden</button></div>
</div></div>

<div id="mOrden" class="modal" onclick="if(event.target===this)cerrar('mOrden')"><div class="box"><button class="x" title="Cerrar" onclick="cerrar('mOrden')">✕</button><div id="oCuerpo"></div></div></div>

<script>
const SB = 'https://vlilvrxfppppzwyaeviu.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsaWx2cnhmcHBwcHp3eWFldml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NDIwMTMsImV4cCI6MjEwMDIxODAxM30.Bmo4CNDDbSF7Vp9JpDm7ceKUlsKKdufKcKFDIGHS4Hs';
/* camino de cada tipo: [nombre, quién lo hace, días que toma]. Las fechas salen hacia atrás desde «a la venta el» */
const ETAPAS = {
  diseno:['Diseño','Ana',5], muestra:['Muestra','Ana',5], molde:['Molde','Ana',3], tela:['Tela','Ana',3], escalado:['Escalado','Ana',2],
  corte:['Corte y confección','Taller',10], entrega:['Entrega','Ana',1], calidad:['Calidad','Roxana',1], inventario:['Inventario','Stephanie',1],
  fotos:['Fotos y videos','Heily',3], venta:['A la venta','—',0] };
const CAMINO = { nuevo:['diseno','muestra','molde','tela','escalado','corte','entrega','calidad','inventario','fotos','venta'],
                 reposicion:['tela','corte','entrega','calidad','inventario','venta'] };
const TALLAS = ['XS','S','M','L','XL','2XL','3XL'];
const TALLERES = ['José Luis','Dan','Pedro','Ángel','Bella','Jhon','Jefferson'];
let D = { ordenes:[], lineas:[], movs:[], stock:null }, NV = null, OA = null;
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nrm = s => String(s || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
function tok(){ try { const t = JSON.parse(localStorage.getItem('erp_sb_sess') || 'null'); return (t && t.access_token && Date.now() < (t.expires_at || 0)) ? t.access_token : null; } catch (e) { return null; } }
async function sb(ruta, opt){
  const t = tok(); if (!t) throw new Error('Tu sesión del ERP venció: recarga la página.');
  const r = await fetch(SB + ruta, Object.assign({ headers:{ apikey:ANON, Authorization:'Bearer ' + t, 'Content-Type':'application/json' } }, opt || {}));
  if (!r.ok){ const x = await r.text(); throw new Error(r.status === 404 ? 'Falta instalar Producción en la base (lo pega Pablo una vez).' : 'La base respondió ' + r.status + ' ' + x.slice(0, 120)); }
  return r.json();
}
const rpc = (fn, body) => sb('/rest/v1/rpc/' + fn, { method:'POST', body: JSON.stringify(body || {}) });
async function cargar(){
  try {
    const [o, l, m] = await Promise.all([ sb('/rest/v1/prod_ordenes?select=*&order=id.desc'), sb('/rest/v1/prod_lineas?select=*'), sb('/rest/v1/prod_movs?select=*&order=id') ]);
    D.ordenes = o; D.lineas = l; D.movs = m;
  } catch (e) { document.getElementById('tablero').innerHTML = '<div class="vacio err">' + esc(e.message) + '</div>'; return; }
  pintar();
}
/* ── saldos de una orden por color × talla: pedidas · listas (buenas + corregidas) · en corrección · perdidas · faltan entregar ── */
function saldos(o){
  const L = D.lineas.filter(x => x.orden_id === o.id), M = D.movs.filter(x => x.orden_id === o.id), k = (c, t) => c + '|' + t, S = {};
  const nuevo = (c, t) => ({ color:c, talla:t, pedido:0, buena:0, falla:0, corregida:0, perdida:0, yayita:0 });
  L.forEach(x => { S[k(x.color, x.talla)] = Object.assign(nuevo(x.color, x.talla), { pedido:x.pedido }); });
  M.forEach(x => { const s = S[k(x.color, x.talla)] || (S[k(x.color, x.talla)] = nuevo(x.color, x.talla)); s[x.tipo] += x.cantidad; });
  const T = { pedido:0, buenas:0, correccion:0, perdidas:0, yayitas:0, falta:0, porIngresar:0 };
  M.forEach(x => { if (!x.ingresado && ['buena', 'corregida', 'yayita'].indexOf(x.tipo) >= 0) T.porIngresar += x.cantidad; });
  Object.values(S).forEach(s => { s.buenas = s.buena + s.corregida; s.correccion = Math.max(0, s.falla - s.corregida - s.perdida - s.yayita); s.perdidas = s.perdida; s.yayitas = s.yayita;   /* 21-oct F1b · yayita = falla sin arreglo que se vende barata */
    s.falta = Math.max(0, s.pedido - s.buenas - s.correccion - s.perdidas - s.yayitas);
    T.pedido += s.pedido; T.buenas += s.buenas; T.correccion += s.correccion; T.perdidas += s.perdidas; T.yayitas += s.yayitas; T.falta += s.falta; });
  return { S, T };
}
/* ── fechas objetivo: hacia atrás desde «a la venta el». F[etapa] = día en que esa etapa tiene que estar TERMINADA ── */
function fechas(o){
  const C = CAMINO[o.tipo] || CAMINO.reposicion, F = {}; if (!o.fecha_venta) return F;
  let d = new Date(o.fecha_venta + 'T00:00:00');
  for (let i = C.length - 1; i >= 0; i--){ F[C[i]] = new Date(d); d = new Date(d.getTime() - (ETAPAS[C[i]][2] || 0) * 864e5); }
  return F;
}
const hoy0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const fTxt = d => d ? d.toLocaleDateString('es-PE', { day:'numeric', month:'short' }).replace('.', '') : '—';
function estadoFecha(o){
  const f = fechas(o)[o.etapa]; if (!f || o.cerrada) return { col:'', txt:'' };
  const n = Math.round((f - hoy0()) / 864e5);
  return n < 0 ? { col:'rd', txt:'atrasada ' + (-n) + ' d' } : n <= 2 ? { col:'am', txt:'vence ' + (n === 0 ? 'hoy' : 'en ' + n + ' d') } : { col:'', txt:'para el ' + fTxt(f) };
}
function pintar(){
  const ver = document.getElementById('fVer').value, ta = document.getElementById('fTaller').value;
  const talleres = [...new Set(TALLERES.concat(D.ordenes.map(o => o.taller).filter(Boolean)))];
  const sel = document.getElementById('fTaller'); if (sel.options.length <= 1) talleres.forEach(t => sel.add(new Option(t, t)));
  document.getElementById('lTaller').innerHTML = talleres.map(t => '<option value="' + esc(t) + '">').join('');
  const L = D.ordenes.filter(o => (ver === 'cerradas' ? o.cerrada : !o.cerrada) && (!ta || o.taller === ta));
  const el = document.getElementById('tablero');
  if (!L.length){ el.innerHTML = '<div class="vacio">' + (ver === 'cerradas' ? 'Todavía no hay órdenes cerradas.' : 'No hay órdenes en curso. Crea la primera con ＋ Nueva orden.') + '</div>'; return; }
  el.innerHTML = CAMINO.nuevo.filter(e => L.some(o => o.etapa === e)).map(e => {
    const C = L.filter(o => o.etapa === e);
    return '<div class="col"><h3><span>' + ETAPAS[e][0] + '</span><span>' + C.length + '</span></h3>' + C.map(o => {
      const { T } = saldos(o), ef = estadoFecha(o), pct = T.pedido ? Math.round(T.buenas / T.pedido * 100) : 0;
      return '<div class="card ' + ef.col + '" onclick="abrirOrden(' + o.id + ')"><b>' + esc(o.diseno) + '</b>'
        + '<div class="l">' + esc(o.codigo || '') + ' · ' + (o.tipo === 'nuevo' ? 'Nuevo' : 'Reposición') + ' · ' + esc(o.taller || 'sin taller') + '</div>'
        + '<div class="l">' + T.buenas + ' de ' + T.pedido + ' listas (' + pct + '%)' + (T.correccion ? ' · <span class="chip am">' + T.correccion + ' en corrección</span>' : '') + (T.perdidas ? ' <span class="chip rd">' + T.perdidas + ' perdidas</span>' : '') + (T.yayitas ? ' <span class="chip">' + T.yayitas + ' yayitas</span>' : '') + '</div>'
        + (T.porIngresar ? '<div class="l"><span class="chip am">📦 ' + T.porIngresar + ' por ingresar al stock</span></div>' : '')
        + (ef.txt ? '<div class="l"><span class="chip ' + ef.col + '">' + ef.txt + '</span></div>' : '')
        + '<div class="bar"><i style="width:' + pct + '%"></i></div></div>'; }).join('') + '</div>';
  }).join('');
}
/* ── nueva orden: el producto sale de la lista de Stock/Productos; en reposición se ve lo que hay y lo vendido en 90 días ── */
async function cargarStock(){
  if (D.stock) return D.stock;
  try { const j = await rpc('mk_escalamiento_stock'); D.stock = (j && j.filas) || []; } catch (e) { D.stock = []; }
  document.getElementById('lDis').innerHTML = [...new Set(D.stock.map(x => nrm(x.p + ' ' + x.d)))].sort().map(x => '<option value="' + esc(x) + '">').join('');
  return D.stock;
}
async function abrirNueva(o){
  await cargarStock();
  NV = { id: o ? o.id : null, colores: [], q: {} };
  document.getElementById('nTit').textContent = o ? '✏️ Editar ' + o.codigo : '＋ Nueva orden de producción';
  document.getElementById('nDis').value = o ? o.diseno : ''; document.getElementById('nTipo').value = o ? o.tipo : 'reposicion';
  document.getElementById('nTaller').value = o ? (o.taller || '') : ''; document.getElementById('nTela').value = o ? (o.tela || '') : '';
  document.getElementById('nFecha').value = o ? (o.fecha_venta || '') : ''; document.getElementById('nCosto').value = o && o.costo_unit != null ? o.costo_unit : '';
  document.getElementById('nNotas').value = o ? (o.notas || '') : ''; document.getElementById('nMsg').textContent = '';
  if (o) D.lineas.filter(x => x.orden_id === o.id).forEach(x => { if (NV.colores.indexOf(x.color) < 0) NV.colores.push(x.color); NV.q[x.color + '|' + x.talla] = x.pedido; });
  nProducto(true); document.getElementById('mNueva').style.display = 'flex';
}
function piezasDe(dis){ const k = nrm(dis); return (D.stock || []).filter(x => nrm(x.p + ' ' + x.d) === k); }
function nProducto(mantener){
  const P = piezasDe(document.getElementById('nDis').value);
  if (!mantener || !NV.colores.length){ if (P.length) NV.colores = [...new Set(P[0].x.filter(a => (+a[2] || 0) > 0 || (+a[4] || 0) > 0).map(a => String(a[0])))].sort(); }
  document.getElementById('nAyuda').textContent = P.length ? 'Debajo de cada casilla: hay hoy · vendidas en 90 días.' : 'Producto nuevo (todavía sin stock): agrega sus colores.';
  nGrid();
}
const qs = c => c.replace(/'/g, "\\'");
function nGrid(){
  const P = piezasDe(document.getElementById('nDis').value)[0], info = (c, t) => { const a = P && P.x.find(a => String(a[0]) === c && String(a[1]).toUpperCase() === t); return a ? '<small>' + a[2] + ' · ' + a[4] + '</small>' : ''; };
  if (!NV.colores.length){ document.getElementById('nGrid').innerHTML = '<div class="mu">Agrega al menos un color.</div>'; nTotal(); return; }
  document.getElementById('nGrid').innerHTML = '<table class="g"><tr><th>Color</th>' + TALLAS.map(t => '<th>' + t + '</th>').join('') + '<th>Total</th><th></th></tr>'
    + NV.colores.map(c => '<tr><td><b>' + esc(c) + '</b></td>' + TALLAS.map(t => '<td><input type="number" min="0" value="' + (NV.q[c + '|' + t] || '') + '" oninput="NV.q[\'' + qs(c) + '|' + t + '\']=+this.value||0;nTotal()">' + info(c, t) + '</td>').join('')
      + '<td class="tt" data-c="' + esc(c) + '"></td><td><button title="Quitar color" onclick="NV.colores=NV.colores.filter(x=>x!==\'' + qs(c) + '\');nGrid()">✕</button></td></tr>').join('') + '</table>';
  nTotal();
}
function nTotal(){
  let tot = 0; NV.colores.forEach(c => { const s = TALLAS.reduce((a, t) => a + (NV.q[c + '|' + t] || 0), 0); tot += s; const td = [...document.querySelectorAll('td.tt')].find(x => x.dataset.c === c); if (td) td.textContent = s || ''; });
  document.getElementById('nTot').textContent = 'Total: ' + tot + ' prendas';
}
function nAgregarColor(){ const c = nrm(document.getElementById('nColor').value); if (!c) return; if (NV.colores.indexOf(c) < 0) NV.colores.push(c); document.getElementById('nColor').value = ''; nGrid(); }
async function guardarOrden(){
  const b = document.getElementById('nOk'), msg = document.getElementById('nMsg'); msg.textContent = '';
  const lineas = []; NV.colores.forEach(c => TALLAS.forEach(t => { const n = NV.q[c + '|' + t] || 0; if (n > 0) lineas.push({ color:c, talla:t, pedido:n }); }));
  if (!document.getElementById('nDis').value.trim()) { msg.textContent = 'Falta el producto.'; return; }
  if (!lineas.length) { msg.textContent = 'Pon al menos una cantidad.'; return; }
  b.disabled = true;
  try {
    const r = await rpc('prod_orden_guardar', { p_id: NV.id, p_diseno: document.getElementById('nDis').value, p_tipo: document.getElementById('nTipo').value,
      p_taller: document.getElementById('nTaller').value, p_tela: document.getElementById('nTela').value, p_fecha_venta: document.getElementById('nFecha').value || null,
      p_costo_unit: document.getElementById('nCosto').value === '' ? null : +document.getElementById('nCosto').value, p_notas: document.getElementById('nNotas').value, p_lineas: lineas });
    if (!r.ok) throw new Error(r.error);
    cerrar('mNueva'); await cargar(); abrirOrden(r.id);
  } catch (e) { msg.textContent = e.message; }
  b.disabled = false;
}
/* ── detalle: camino con fechas, saldos por color × talla, registrar entrega y corrección, historial ── */
function abrirOrden(id){
  const o = D.ordenes.find(x => x.id === id); if (!o) return; OA = o;
  const C = CAMINO[o.tipo] || CAMINO.reposicion, F = fechas(o), i = C.indexOf(o.etapa), ef = estadoFecha(o);
  const { S, T } = saldos(o), filas = Object.values(S), colores = [...new Set(filas.map(s => s.color))].sort(), tallas = TALLAS.filter(t => filas.some(s => s.talla === t));
  const celda = (c, t, f) => { const s = S[c + '|' + t]; return s ? f(s) : '<td class="mu">·</td>'; };
  let h = '<h2>' + esc(o.diseno) + ' <span class="mu" style="font-weight:400">· ' + esc(o.codigo) + ' · ' + (o.tipo === 'nuevo' ? 'Nuevo' : 'Reposición') + ' · ' + esc(o.taller || 'sin taller') + '</span></h2>'
    + '<div class="camino">' + C.map((e, j) => '<span class="et ' + (j < i ? 'hecha' : j === i ? 'act' + (ef.col === 'rd' ? ' tarde' : '') : '') + '" title="' + ETAPAS[e][1] + (F[e] ? ' · para el ' + fTxt(F[e]) : '') + '">' + (j < i ? '✓ ' : '') + ETAPAS[e][0] + (F[e] ? ' · ' + fTxt(F[e]) : '') + '</span>').join('') + '</div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
    + (o.cerrada ? '<span class="chip">Cerrada</span>' : (i > 0 ? '<button onclick="etapa(\'' + C[i - 1] + '\')">↩ Volver a ' + ETAPAS[C[i - 1]][0] + '</button>' : '')
      + (i < C.length - 1 ? '<button class="p" onclick="etapa(\'' + C[i + 1] + '\')">Pasar a ' + ETAPAS[C[i + 1]][0] + ' →</button>' : '<button class="p" onclick="etapa(\'cerrada\')">✓ Cerrar orden</button>'))
    + (ef.txt ? '<span class="chip ' + ef.col + '">' + ETAPAS[o.etapa][0] + ': ' + ef.txt + ' · ' + ETAPAS[o.etapa][1] + '</span>' : '')
    + '<span class="sp"></span><button onclick="abrirNueva(OA)">✏️ Editar</button></div>'
    + '<div class="res"><div><b>' + T.pedido + '</b>pedidas</div><div><b class="okt">' + T.buenas + '</b>listas (al stock)</div><div><b style="color:var(--am)">' + T.correccion + '</b>en corrección</div><div><b class="err">' + T.perdidas + '</b>perdidas</div><div><b>' + T.yayitas + '</b>yayitas</div><div><b>' + T.falta + '</b>faltan entregar</div></div>'
    + '<table class="g"><tr><th>Color</th>' + tallas.map(t => '<th>' + t + '</th>').join('') + '</tr>'
    + colores.map(c => '<tr><td><b>' + esc(c) + '</b></td>' + tallas.map(t => celda(c, t, s => '<td class="' + (s.correccion ? 'ag' : '') + '" title="Pedidas ' + s.pedido + ' · listas ' + s.buenas + ' · corrección ' + s.correccion + ' · perdidas ' + s.perdidas + '">' + s.buenas + '/' + s.pedido + (s.correccion ? '<small>' + s.correccion + ' en corr.</small>' : '') + '</td>')).join('') + '</tr>').join('') + '</table>'
    + '<div class="mu" style="font-size:11px">listas / pedidas · rojo = tiene prendas en corrección</div>';
  const PI = D.movs.filter(x => x.orden_id === o.id && !x.ingresado && ['buena', 'corregida', 'yayita'].indexOf(x.tipo) >= 0);
  if (PI.length) h += '<div class="sec" style="border-color:var(--am)"><h4>📦 Por ingresar al stock: ' + T.porIngresar + ' prendas</h4>'
    + '<div class="mu" style="font-size:11.5px">Se abre el «＋ Ingresar stock» de siempre con todo ya cargado. Las yayitas entran directo al montón de Fallas con destino Yayitas.</div>'
    + '<button class="p" style="margin-top:6px" onclick="ingresarStock()">📦 Ingresar al stock</button> <span id="iMsg" class="err"></span></div>';
  if (!o.cerrada){
    h += '<div class="sec"><h4>📦 Registrar entrega del taller</h4><div class="mu" style="font-size:11.5px">Buenas = van al stock · Con falla = vuelven al taller a corregir.</div>'
      + gridMov('e', colores, tallas, S, [['buena','Buenas'], ['falla','Con falla']]) + '<button class="p" onclick="guardarMov(\'e\')">Guardar entrega</button> <span id="eMsg" class="err"></span></div>';
    if (T.correccion) h += '<div class="sec"><h4>🔧 Prendas en corrección (' + T.correccion + ')</h4><div class="mu" style="font-size:11.5px">Corregidas = volvieron bien (van al stock) · Yayitas = sin arreglo pero se venden baratas (van al montón de Fallas) · Perdidas = no se pueden vender. Yayita y pérdida piden el motivo.</div>'
      + gridMov('c', colores, tallas, S, [['corregida','Corregidas'], ['yayita','Yayitas'], ['perdida','Perdidas']], s => s.correccion > 0)
      + '<input id="cMotivo" list="lMot" placeholder="Motivo (yayita o pérdida)" style="width:260px"><datalist id="lMot">' + motivos().map(m => '<option value="' + esc(m) + '">').join('') + '</datalist> <button class="p" onclick="guardarMov(\'c\')">Guardar</button> <span id="cMsg" class="err"></span></div>';
  }
  const M = D.movs.filter(x => x.orden_id === o.id).slice().reverse();
  if (M.length) h += '<div class="sec"><h4>Historial</h4><table class="g"><tr><th>Fecha</th><th>Qué</th><th>Color · talla</th><th>Cant.</th><th>Motivo</th><th></th></tr>'
    + M.map(m => '<tr><td>' + esc(m.fecha) + '</td><td>' + ({ buena:'✓ Buena', falla:'⚠ Con falla', corregida:'🔧 Corregida', perdida:'✕ Perdida', yayita:'🏷 Yayita' })[m.tipo] + (m.ingresado ? ' <span class="chip">en stock' + (m.lote ? ' · ' + esc(m.lote) : '') + '</span>' : '') + '</td><td>' + esc(m.color + ' · ' + m.talla) + '</td><td>' + m.cantidad + '</td><td>' + esc(m.motivo || '') + '</td>'
      + '<td>' + (m.ingresado ? '' : '<button title="Deshacer (cargado por error)" onclick="borrarMov(' + m.id + ')">✕</button>') + '</td></tr>').join('') + '</table></div>';
  document.getElementById('oCuerpo').innerHTML = h; document.getElementById('mOrden').style.display = 'flex';
}
function gridMov(pre, colores, tallas, S, tipos, filtro){
  return tipos.map(([tp, nom]) => '<div style="margin-top:6px"><b style="font-size:12px">' + nom + '</b><table class="g"><tr><th>Color</th>' + tallas.map(t => '<th>' + t + '</th>').join('') + '</tr>'
    + colores.map(c => '<tr><td>' + esc(c) + '</td>' + tallas.map(t => { const s = S[c + '|' + t]; return (!s || (filtro && !filtro(s))) ? '<td class="mu">·</td>'
      : '<td><input type="number" min="0" data-g="' + pre + '" data-tp="' + tp + '" data-c="' + esc(c) + '" data-t="' + t + '"></td>'; }).join('') + '</tr>').join('') + '</table></div>').join('');
}
async function guardarMov(pre){
  const msg = document.getElementById(pre + 'Msg'); msg.textContent = '';
  const movs = [...document.querySelectorAll('input[data-g="' + pre + '"]')].filter(i => +i.value > 0).map(i => ({ color:i.dataset.c, talla:i.dataset.t, tipo:i.dataset.tp, cantidad:+i.value,
    motivo: (i.dataset.tp === 'perdida' || i.dataset.tp === 'yayita') ? (document.getElementById('cMotivo') || {}).value : null }));
  if (!movs.length){ msg.textContent = 'No pusiste ninguna cantidad.'; return; }
  if (movs.some(m => (m.tipo === 'perdida' || m.tipo === 'yayita') && !String(m.motivo || '').trim())){ msg.textContent = 'Escribe el motivo (yayita o pérdida).'; return; }
  const MOT = motivos().map(x => nrm(x));
  if (MOT.length && movs.some(m => m.tipo === 'yayita' && MOT.indexOf(nrm(m.motivo)) < 0)){ msg.textContent = 'Para una yayita elige el motivo de la lista (es la misma lista de Fallas).'; return; }
  try { const r = await rpc('prod_entrega', { p_id: OA.id, p_movs: movs }); if (!r.ok) throw new Error(r.error); await cargar(); abrirOrden(OA.id); }
  catch (e) { msg.textContent = e.message; }
}
async function etapa(e){ try { const r = await rpc('prod_etapa', { p_id: OA.id, p_etapa: e }); if (!r.ok) throw new Error(r.error); await cargar(); abrirOrden(OA.id); } catch (er) { aviso(er.message); } }
async function borrarMov(id){ try { const r = await rpc('prod_mov_borrar', { p_mov: id }); if (!r.ok) throw new Error(r.error || 'No se pudo'); await cargar(); abrirOrden(OA.id); } catch (e) { aviso(e.message); } }
/* 21-oct F1b · lo bueno entra por el «＋ Ingresar stock» del ERP (una sola puerta al stock) y la orden recuerda qué ya entró */
function motivos(){ try { return (parent && parent !== window && parent.prodMotivosFalla) ? parent.prodMotivosFalla() : []; } catch (e) { return []; } }
function itemsIngreso(o){
  const PI = D.movs.filter(x => x.orden_id === o.id && !x.ingresado && ['buena', 'corregida', 'yayita'].indexOf(x.tipo) >= 0), G = {};
  PI.forEach(m => { const y = m.tipo === 'yayita', k = m.color + '|' + m.talla + '|' + (y ? 'Y|' + (m.motivo || '') : 'B');
    const g = G[k] || (G[k] = { prenda: nrm(o.diseno + ' ' + m.color + ' ' + m.talla), cantidad:0, ids:[] });
    if (y){ g.motivo = m.motivo; g.destino = 'YAYITAS'; }
    g.cantidad += m.cantidad; g.ids.push(m.id); });
  return Object.values(G);
}
function ingresarStock(){
  const msg = document.getElementById('iMsg'), o = OA; msg.textContent = '';
  const G = itemsIngreso(o), ids = G.reduce((a, g) => a.concat(g.ids), []);
  if (!G.length) return;
  if (!(parent && parent !== window && parent.prodIngresarStock)){ msg.textContent = 'Abre Producción desde el ERP para ingresar al stock.'; return; }
  const r = parent.prodIngresarStock(G.map(g => ({ prenda:g.prenda, cantidad:g.cantidad, motivo:g.motivo || '', destino:g.destino || '' })), async res => {
    try { const x = await rpc('prod_marcar_ingresado', { p_ids: ids, p_lote: (res.lotes || []).join(', ') }); if (!x.ok) throw new Error(x.error); }
    catch (e) { aviso('Entró al stock, pero la orden no lo marcó: ' + e.message); }
    await cargar(); abrirOrden(o.id);
  });
  if (r && r.faltan) msg.textContent = 'Estas prendas no existen en la lista de Prendas: ' + r.faltan.join(', ') + '. Revisa el nombre del producto o el color.';
}
function aviso(t){ const m = document.getElementById('msg'); m.textContent = t; m.className = 'err'; setTimeout(() => { m.textContent = ''; m.className = 'mu'; }, 6000); }
function cerrar(id){ document.getElementById(id).style.display = 'none'; }
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ cerrar('mNueva'); cerrar('mOrden'); } });
window.addEventListener('message', e => { const m = e && e.data; if (m && m.tipo === 'erp-tema') document.body.classList.toggle('light', !!m.light);
  if (m && m.tipo === 'erp-refrescar'){ try { e.source.postMessage({ tipo:'erp-refrescar-ok' }, '*'); } catch (_) {} cargar(); } });
try { if (parent !== window) parent.postMessage({ tipo:'erp-tema-pedir' }, '*'); } catch (e) {}
if (typeof process === 'undefined') cargar();
</script></body></html>

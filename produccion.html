<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producción · Tulula</title>
<style>
/* 21-oct-2026 · 🧵 PRODUCCIÓN · Fase 1 (pedido de Pablo). Una orden = un lote de un producto de 📦 Productos (una sola fuente).
   Camino: Nuevo = Diseño → Muestra → Molde → Tela → Escalado → Corte y confección → Entrega → Calidad → Inventario → Fotos → Venta
           Reposición = Tela → Corte y confección → Entrega → Calidad → Inventario → Venta
   Entregas con fallas: buena (va al stock) · falla (va a corrección) · corregida (vuelve arreglada) · perdida (sin arreglo, con motivo). */
:root{--bg:#12161f;--panel:#1a2130;--card:#232b3b;--bd:#37455f;--tx:#e7ecf5;--mu:#93a1b8;--ac:#7c5cff;--ok:#22c55e;--am:#f59e0b;--rd:#ef4444}
body.light{--bg:#eef1f6;--panel:#fff;--card:#fff;--bd:#c8d3e2;--tx:#1b2330;--mu:#5c6b82}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 11px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:5px 8px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;height:54px;position:sticky;top:0;background:var(--bg);z-index:3;border-bottom:1px solid var(--bd)}
.top h1{font-size:16px;margin:0 8px 0 0}.sp{flex:1}.mu{color:var(--mu)}.err{color:var(--rd)}.okt{color:var(--ok)}
.tablero{display:flex;gap:10px;overflow-x:auto;padding:12px 14px;align-items:flex-start}
.col{flex:0 0 230px;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:8px}
.col h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx);margin:-8px -8px 8px;padding:9px 10px 7px;display:flex;justify-content:space-between;gap:6px;position:sticky;top:54px;background:var(--panel);border-bottom:1px solid var(--bd);border-radius:12px 12px 0 0;z-index:2}
.col h3 small{display:block;font-size:10.5px;letter-spacing:0;text-transform:none;color:var(--mu);font-weight:500;margin-top:2px}
.col h3 .n{min-width:22px;height:22px;border-radius:11px;background:var(--bd);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.col.vacia{opacity:.55}.col .nada{font-size:11.5px;color:var(--mu);text-align:center;padding:14px 4px}
/* 21-oct (Pablo) · vista «📍 Dónde está cada orden»: una fila por orden y una columna fija por etapa (como un mapa de metro) */
.lin{padding:0 14px 30px;overflow:auto;height:calc(100vh - 54px)}   /* 21-oct · un solo contenedor con scroll: el encabezado y la columna de la prenda quedan fijos */
.lin .g2{display:grid;grid-template-columns:240px repeat(8,minmax(84px,1fr)) 200px;min-width:1120px;align-items:center}
.lin .cab{position:sticky;top:0;z-index:3;background:var(--bg);padding:6px 0 5px;border-bottom:2px solid var(--bd)}
.lin .cab > div:first-child,.lin .nom{position:sticky;left:0;z-index:2;background:var(--bg);align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding-right:8px}
.lin .cab > div:first-child{z-index:4}
.lin .fila:hover .nom{background:var(--panel)}
.lin .cab .st{text-align:center;font-size:10.5px;line-height:1.25;padding:0 2px}
.lin .cab .st b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.lin .cab .st .q{color:var(--mu)}
.lin .cab .st .c{display:inline-block;margin-top:3px;min-width:20px;padding:1px 6px;border-radius:9px;background:var(--bd);font-size:10.5px}
.lin .cab .st .c.on{background:var(--ac);color:#fff}
.lin .fila{border-bottom:1px solid var(--bd);padding:6px 0;cursor:pointer}
.lin .fila.arr{opacity:.4}.lin .fila.sobre{box-shadow:inset 0 3px 0 var(--ac)}
.lin .nom .asa{cursor:grab;color:var(--mu);margin-right:4px;user-select:none}
.lin .fila:hover{background:var(--panel)}
.lin .nom b{display:block;font-size:13px}.lin .nom span{font-size:11px;color:var(--mu)}
.lin .pt{position:relative;height:26px;display:flex;align-items:center;justify-content:center}
.lin .pt:before,.lin .pt:after{content:'';position:absolute;top:50%;height:3px;transform:translateY(-50%);width:50%}
.lin .pt:before{left:0;background:var(--l,var(--bd))}.lin .pt:after{right:0;background:var(--r,var(--bd))}
.lin .pt.na:before,.lin .pt.na:after{background:repeating-linear-gradient(90deg,var(--bd) 0 4px,transparent 4px 8px)}
.lin .pt i{cursor:pointer;z-index:1}.lin .pt.na i{cursor:default}
.lin .pt.p i{width:22px;height:22px;background:#facc15;box-shadow:0 0 0 4px rgba(250,204,21,.25)}
.lin .pt.p.rd i{background:var(--rd);box-shadow:0 0 0 4px rgba(239,68,68,.25)}
.et{cursor:pointer;user-select:none}.et.proc{background:#facc15;color:#1b2330;border-color:#facc15;font-weight:600}.et.proc.tarde{background:var(--rd);color:#fff;border-color:var(--rd)}
.lin .pt i{position:relative;width:12px;height:12px;border-radius:50%;background:var(--bd);border:2px solid var(--bg)}
.lin .pt.h i{background:var(--ok)}.lin .pt.na i{width:6px;height:6px;opacity:.5}
.lin .nec{font-size:11px;line-height:1.5}
.lin .ley{font-size:11px;color:var(--mu);margin:10px 0 0;display:flex;gap:14px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 9px;margin-bottom:7px;cursor:pointer;border-left:4px solid var(--ok)}
.card.am{border-left-color:var(--am)}.card.rd{border-left-color:var(--rd)}.card:hover{border-color:var(--ac)}
.card b{display:block;font-size:13px}.card .l{font-size:11.5px;color:var(--mu)}
.bar{height:5px;border-radius:4px;background:var(--bd);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.chip{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:9px;background:var(--bd);margin-right:4px}
.chip.am{background:rgba(245,158,11,.2);color:var(--am)}.chip.rd{background:rgba(239,68,68,.18);color:var(--rd)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;z-index:9;overflow:auto;padding:30px 10px}
.box{background:var(--panel);border:1px solid var(--bd);border-radius:14px;width:min(880px,100%);padding:16px;position:relative}
.box h2{font-size:16px;margin:0 30px 10px 0}.x{position:absolute;top:10px;right:10px;border:0;background:transparent;font-size:18px;color:var(--mu)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 10px;margin-bottom:10px}.f label{font-size:11px;color:var(--mu);display:block;margin-bottom:2px}.f input,.f select{width:100%}
table.g{border-collapse:collapse;margin:6px 0;font-size:12px}table.g th,table.g td{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:center}
table.g th:first-child,table.g td:first-child{text-align:left}table.g input{width:48px;text-align:center;padding:3px}
table.g td.ag{background:rgba(239,68,68,.12)}table.g small{display:block;color:var(--mu);font-size:10px}
.camino{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 12px}.et{font-size:11px;padding:4px 8px;border-radius:8px;border:1px solid var(--bd);color:var(--mu)}
.et.hecha{color:var(--ok);border-color:rgba(34,197,94,.4)}.et.act{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}.et.tarde{border-color:var(--rd)}
.res{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}.res div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 10px}.res b{font-size:16px;display:block}
.sec{margin-top:14px;border-top:1px solid var(--bd);padding-top:10px}.sec h4{margin:0 0 6px;font-size:13px}
.vacio{padding:40px;text-align:center;color:var(--mu)}
</style></head><body>
<div class="top"><h1>🧵 Producción</h1>
  <select id="fVer" onchange="pintar()"><option value="lineas">📍 Dónde está cada orden</option><option value="curso">🗂 Tablero por etapa</option><option value="cerradas">✓ Cerradas</option><option value="talleres">📊 Talleres</option></select>
  <select id="fTaller" onchange="pintar()"><option value="">Todos los talleres</option></select>
  <span class="sp"></span><span id="msg" class="mu"></span>
  <button id="btnOrden" onclick="guardarOrden2()" style="display:none;border-color:var(--ac)">💾 Guardar orden</button>
  <button class="p" id="btnNueva" onclick="abrirNueva()">＋ Nueva producción</button>
</div>
<div id="tablero" class="lin"><div class="vacio">Cargando…</div></div>

<div id="mNueva" class="modal" onclick="if(event.target===this)cerrar('mNueva')"><div class="box">
  <button class="x" title="Cerrar" onclick="cerrar('mNueva')">✕</button><h2 id="nTit">＋ Nueva producción</h2>
  <div class="f">
    <div><label>Producto (de 📦 Productos)</label><input id="nDis" list="lDis" placeholder="BLAZER MIRELLA" oninput="nProducto()"><datalist id="lDis"></datalist></div>
    <div><label>Tipo</label><select id="nTipo"><option value="reposicion">Reposición</option><option value="nuevo">Nuevo</option></select></div>
    <div><label>Taller</label><input id="nTaller" list="lTaller"><datalist id="lTaller"></datalist></div>
    <div><label>Tela - proveedor</label><input id="nTela" placeholder="Mirella - Colortex"></div>
    <div><label>A la venta el</label><input id="nFecha" type="date"></div>
    <div><label>Costo por prenda (S/)</label><input id="nCosto" type="number" step="0.5" min="0"></div>
    <div><label>Derivado al taller el (tela e insumos entregados)</label><input id="nFTal" type="date"></div>
    <div><label>Días de confección del taller</label><input id="nDias" type="number" min="0" max="120" step="1" placeholder="10"></div>
  </div>
  <div class="mu" id="nAyuda" style="font-size:11.5px"></div>
  <div id="nGrid"></div>
  <div style="display:flex;gap:6px;align-items:center;margin-top:6px"><input id="nColor" placeholder="Agregar color" style="width:150px"><button onclick="nAgregarColor()">＋ Color</button><span class="sp"></span>
    <span class="mu" id="nTot"></span></div>
  <div class="f" style="margin-top:8px"><div style="grid-column:1/-1"><label>Notas</label><input id="nNotas"></div></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><span id="nMsg" class="err"></span><button onclick="cerrar('mNueva')">Cancelar</button><button class="p" id="nOk" onclick="guardarOrden()">Guardar orden</button></div>
</div></div>

<div id="mOrden" class="modal" onclick="if(event.target===this)cerrar('mOrden')"><div class="box"><button class="x" title="Cerrar" onclick="cerrar('mOrden')">✕</button><div id="oCuerpo"></div></div></div>

<script>
const SB = 'https://vlilvrxfppppzwyaeviu.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsaWx2cnhmcHBwcHp3eWFldml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NDIwMTMsImV4cCI6MjEwMDIxODAxM30.Bmo4CNDDbSF7Vp9JpDm7ceKUlsKKdufKcKFDIGHS4Hs';
/* camino de cada tipo: [nombre, quién lo hace, días que toma]. Las fechas salen hacia atrás desde «a la venta el» */
/* 21-oct 14:40 (Pablo) · 8 etapas: Muestra y moldes es una sola; Tela e insumos; Escalado no va; Calidad e inventario es una sola;
   A la venta (web y ERP). El PLAZO es uno solo para todo el producto (la fecha de venta), no uno por etapa. */
const ETAPAS = {
  diseno:['Diseño','Ana',5], muestra:['Muestra y moldes','Ana',7], tela:['Tela e insumos','Ana',3],
  corte:['Corte y confección','Taller',10], entrega:['Entrega','Ana',1], calidad:['Calidad e inventario','Roxana · Stephanie',2],
  fotos:['Fotos y videos','Heily',3], venta:['A la venta (web y ERP)','—',0] };
const CAMINO = { nuevo:['diseno','muestra','tela','corte','entrega','calidad','fotos','venta'],
                 reposicion:['tela','corte','entrega','calidad','venta'] };
const ETAPA_VIEJA = { molde:'muestra', escalado:'tela', inventario:'calidad' };   /* órdenes guardadas con las etapas de antes */
const TALLAS = ['XS','S','M','L','XL','2XL','3XL'];
const TALLERES = ['José Luis','Dan','Pedro','Ángel','Bella','Jhon','Jefferson'];
let D = { ordenes:[], lineas:[], movs:[], pagos:[], arch:[], ins:[], urls:{}, stock:null, prod:null, param:{ yayita_desc_pct:40 } }, NV = null, OA = null;
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nrm = s => String(s || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
function tok(){ try { const t = JSON.parse(localStorage.getItem('erp_sb_sess') || 'null'); return (t && t.access_token && Date.now() < (t.expires_at || 0)) ? t.access_token : null; } catch (e) { return null; } }
async function sb(ruta, opt){
  const t = tok(); if (!t) throw new Error('Tu sesión del ERP venció: recarga la página.');
  const r = await fetch(SB + ruta, Object.assign({ headers:{ apikey:ANON, Authorization:'Bearer ' + t, 'Content-Type':'application/json' } }, opt || {}));
  if (!r.ok){ const x = await r.text(); throw new Error(r.status === 404 ? 'Falta instalar Producción en la base (lo pega Pablo una vez).' : 'La base respondió ' + r.status + ' ' + x.slice(0, 120)); }
  return r.json();
}
const rpc = (fn, body) => sb('/rest/v1/rpc/' + fn, { method:'POST', body: JSON.stringify(body || {}) });
async function cargar(){
  try {
    const [o, l, m] = await Promise.all([ sb('/rest/v1/prod_ordenes?select=*&order=id.desc'), sb('/rest/v1/prod_lineas?select=*'), sb('/rest/v1/prod_movs?select=*&order=id') ]);
    D.ordenes = o; D.lineas = l; D.movs = m;
    D.ordenes.forEach(x => { if (ETAPA_VIEJA[x.etapa]) x.etapa = ETAPA_VIEJA[x.etapa]; });
    D._etapaGuardada = {}; D.ordenes.forEach(x => { D._etapaGuardada[x.id] = x.etapa; });
    try { D.pagos = await sb('/rest/v1/prod_pagos?select=*&order=fecha'); } catch (_) { D.pagos = []; }
    try { D.arch = await sb('/rest/v1/prod_archivos?select=*&order=id'); } catch (_) { D.arch = []; }
    try { D.ins = await sb('/rest/v1/prod_insumos?select=*&order=orden'); } catch (_) { D.ins = []; }   /* 21-oct · ficha técnica paso 2 */   /* 21-oct · ficha técnica */
    /* 21-oct F3 · 📦 Productos (una sola fuente de productos) y ajustes editables */
    try { const P = await rpc('prod_productos'); D.prod = null; if (Array.isArray(P) && P.length){ D.prod = {}; P.forEach(x => { D.prod[nrm(x.diseno)] = x; }); } } catch (_) { D.prod = null; }   /* sin lista = no se sabe: no se avisa «no existe» */
    try { (await sb('/rest/v1/prod_param?select=clave,valor')).forEach(x => { D.param[x.clave] = +x.valor; }); } catch (_) {}
    D.ordenes.forEach(x => { if (!x.cerrada) x.etapa = etapaActual(x); });   /* 21-oct · con lo que el ERP marcó solo */   /* 21-oct F2 · si la tabla no está instalada, sigue sin pagos */
  } catch (e) { document.getElementById('tablero').innerHTML = '<div class="vacio err">' + esc(e.message) + '</div>'; return; }
  pintar();
  publicarAlerta();
}
/* ── saldos de una orden por color × talla: pedidas · listas (buenas + corregidas) · en corrección · perdidas · faltan entregar ── */
function saldos(o){
  const L = D.lineas.filter(x => x.orden_id === o.id), M = D.movs.filter(x => x.orden_id === o.id), k = (c, t) => c + '|' + t, S = {};
  const nuevo = (c, t) => ({ color:c, talla:t, pedido:0, buena:0, falla:0, corregida:0, perdida:0, yayita:0 });
  L.forEach(x => { S[k(x.color, x.talla)] = Object.assign(nuevo(x.color, x.talla), { pedido:x.pedido }); });
  M.forEach(x => { const s = S[k(x.color, x.talla)] || (S[k(x.color, x.talla)] = nuevo(x.color, x.talla)); s[x.tipo] += x.cantidad; });
  const T = { pedido:0, buenas:0, correccion:0, perdidas:0, yayitas:0, falta:0, porIngresar:0 };
  M.forEach(x => { if (!x.ingresado && ['buena', 'corregida', 'yayita'].indexOf(x.tipo) >= 0) T.porIngresar += x.cantidad; });
  Object.values(S).forEach(s => { s.buenas = s.buena + s.corregida; s.correccion = Math.max(0, s.falla - s.corregida - s.perdida - s.yayita); s.perdidas = s.perdida; s.yayitas = s.yayita;   /* 21-oct F1b · yayita = falla sin arreglo que se vende barata */
    s.falta = Math.max(0, s.pedido - s.buenas - s.correccion - s.perdidas - s.yayitas);
    T.pedido += s.pedido; T.buenas += s.buenas; T.correccion += s.correccion; T.perdidas += s.perdidas; T.yayitas += s.yayitas; T.falta += s.falta; });
  return { S, T };
}
/* ── fechas objetivo: hacia atrás desde «a la venta el». F[etapa] = día en que esa etapa tiene que estar TERMINADA ── */
function fechas(o){
  const C = CAMINO[o.tipo] || CAMINO.reposicion, F = {}; if (!o.fecha_venta) return F;
  let d = new Date(o.fecha_venta + 'T00:00:00');
  for (let i = C.length - 1; i >= 0; i--){ F[C[i]] = new Date(d); d = new Date(d.getTime() - (ETAPAS[C[i]][2] || 0) * 864e5); }
  return F;
}
const hoy0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const fTxt = d => d ? d.toLocaleDateString('es-PE', { day:'numeric', month:'short' }).replace('.', '') : '—';
function estadoFecha(o){
  /* 21-oct (Pablo) · un solo plazo para todo el producto: la fecha en que tiene que estar a la venta */
  if (!o.fecha_venta || o.cerrada || o.etapa === 'venta') return { col:'', txt:'' };
  const n = Math.round((new Date(o.fecha_venta + 'T00:00:00') - hoy0()) / 864e5);
  return n < 0 ? { col:'rd', txt:'atrasada ' + (-n) + ' d' } : { col:'', txt:'a la venta el ' + fTxt(new Date(o.fecha_venta + 'T00:00:00')) + ' · faltan ' + n + ' d' };
}
function pintar(){
  const ver = document.getElementById('fVer').value, ta = document.getElementById('fTaller').value;
  const talleres = [...new Set(TALLERES.concat(D.ordenes.map(o => o.taller).filter(Boolean)))];
  const sel = document.getElementById('fTaller'); if (sel.options.length <= 1) talleres.forEach(t => sel.add(new Option(t, t)));
  document.getElementById('lTaller').innerHTML = talleres.map(t => '<option value="' + esc(t) + '">').join('');
  const el = document.getElementById('tablero');
  if (ver === 'talleres'){ el.innerHTML = talleresHtml(ta); return; }
  const L = D.ordenes.filter(o => (ver === 'cerradas' ? o.cerrada : !o.cerrada) && (!ta || o.taller === ta));
  if (ver === 'lineas'){ el.className = 'lin'; el.innerHTML = lineasHtml(L); activarArrastre(); return; }
  el.className = 'tablero';
  if (!L.length && ver === 'cerradas'){ el.innerHTML = '<div class="vacio">Todavía no hay órdenes cerradas.</div>'; return; }
  /* 21-oct (Pablo) · TODAS las etapas siempre a la vista (aunque no tengan prendas), con su encabezado fijo y su responsable */
  el.innerHTML = CAMINO.nuevo.map(e => {
    const C = L.filter(o => o.etapa === e);
    return '<div class="col' + (C.length ? '' : ' vacia') + '"><h3><span>' + ETAPAS[e][0] + '<small>👤 ' + ETAPAS[e][1] + (CAMINO.reposicion.indexOf(e) < 0 ? ' · solo nuevos' : '') + '</small></span><span class="n">' + C.length + '</span></h3>'
      + (C.length ? '' : '<div class="nada">Nada en esta etapa</div>') + C.map(o => {
      const { T } = saldos(o), ef = estadoFecha(o), pct = T.pedido ? Math.round(T.buenas / T.pedido * 100) : 0;
      return '<div class="card ' + ef.col + '" onclick="abrirOrden(' + o.id + ')"><b>' + NR(o) + esc(o.diseno) + '</b>'
        + '<div class="l">' + esc(o.codigo || '') + ' · ' + esc(o.taller || 'sin taller') + '</div>'
        + '<div class="l">' + T.buenas + ' de ' + T.pedido + ' listas (' + pct + '%)' + (T.correccion ? ' · <span class="chip am">' + T.correccion + ' en corrección</span>' : '') + (T.perdidas ? ' <span class="chip rd">' + T.perdidas + ' perdidas</span>' : '') + (T.yayitas ? ' <span class="chip">' + T.yayitas + ' yayitas</span>' : '') + '</div>'
        + (viejas(o) ? '<div class="l"><span class="chip rd">🕒 ' + viejas(o) + ' en corrección hace +30 días · ¿Yayita?</span></div>' : '')
        + (T.porIngresar ? '<div class="l"><span class="chip am">📦 ' + T.porIngresar + ' por ingresar al stock</span></div>' : '')

  const b = document.getElementById('btnOrden'), ids = [...document.querySelectorAll('#tablero .fila')].map(f => +f.dataset.id);
  b.disabled = true; b.textContent = 'Guardando…';
  try { const r = await rpc('prod_reordenar', { p_ids: ids }); if (!r.ok) throw new Error(r.error); b.style.display = 'none'; await cargar(); }
  catch (e) { aviso(e.message); }
  b.disabled = false; b.textContent = '💾 Guardar orden';
}
/* ══ 21-oct (Pablo) · 📐 FICHA TÉCNICA paso 1: archivos del producto (diseño · muestra · moldes). Es del PRODUCTO: la ven todas sus producciones.
   Van a un espacio privado (bucket «produccion»); las miniaturas se piden firmadas por 10 minutos. ══ */
const FICHA_T = [['diseno', '✏️ Diseño', 'Boceto, ficha o referencia'], ['muestra', '👗 Muestra', 'Fotos de la muestra aprobada'], ['molde', '📐 Moldes', 'Moldes y escalado (foto o PDF)'], ['otro', '📎 Otros', 'Lo que haga falta']];
const esImg = a => /^image\//.test(a.mime || '') || /\.(jpe?g|png|webp|gif|heic)$/i.test(a.nombre || '');
function fichaHtml(o){
  const d = nrm(o.diseno), FA = D.arch.filter(x => x.diseno === d);
  return '<div class="sec"><h4>📐 Ficha técnica de ' + esc(d) + ' <span class="mu" style="font-weight:400;font-size:11.5px">· vale para todas sus producciones</span></h4>'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px">'
    + FICHA_T.map(([t, nom, ay]) => { const L = FA.filter(x => x.tipo === t);
      return '<div style="border:1px solid var(--bd);border-radius:10px;padding:8px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:12.5px">' + nom + (L.length ? ' <span class="chip okt">✓ ' + L.length + '</span>' : '') + '</b>'
        + '<label style="cursor:pointer;font-size:11.5px;color:var(--ac);font-weight:600">＋ Subir<input type="file" multiple accept="image/*,application/pdf,.dxf,.plt,.ai,.zip" style="display:none" onchange="subirFicha(this, \'' + t + '\')"></label></div>'
        + '<div class="mu" style="font-size:10.5px;margin:2px 0 6px">' + ay + '</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:6px">' + (L.length ? L.map(a => '<div style="position:relative">'
          + (esImg(a) ? '<img data-ruta="' + esc(a.ruta) + '" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--bd);cursor:pointer" onclick="verArchivo(this.dataset.ruta)">'
                      : '<span class="chip" style="cursor:pointer" data-ruta="' + esc(a.ruta) + '" onclick="verArchivo(this.dataset.ruta)">📄 ' + esc((a.nombre || 'archivo').slice(0, 22)) + '</span>')
          + '<button title="Quitar" onclick="borrarArchivo(' + a.id + ')" style="position:absolute;top:-6px;right:-6px;padding:0 5px;font-size:10px;border-radius:10px">✕</button></div>').join('') : '<span class="mu" style="font-size:11px">Sin archivos</span>') + '</div>'
        + '<div class="mu" id="fMsg-' + t + '" style="font-size:11px"></div></div>'; }).join('')
    + '</div>' + insumosHtml(o) + '</div>';
}
/* ══ 21-oct (Pablo) · FICHA TÉCNICA paso 2: INSUMOS del producto → costo por prenda → se llevan a 📦 Productos (la que manda en costos) ══ */
const COMPS = [['confeccion','Confección'],['tela1','Tela'],['entretela','Entretela'],['forro','Forro'],['elastico','Elástico'],['etiqueta','Etiqueta'],['botones','Botones'],['cierre','Cierre/broches'],['packaging','Packaging'],['otros','Otros']];
/* 21-oct 17:30 (Pablo: «una sola forma de introducir los costos») · aquí solo se LEEN; se cargan en 📦 Productos */
function insumosHtml(o){
  const d = nrm(o.diseno), L = D.ins.filter(x => x.diseno === d), pr = D.prod && D.prod[d];
  if (!pr || pr.costo_unitario == null) return '';   /* costos: solo administración */
  const nom = Object.fromEntries(COMPS), S = x => (+x.cantidad || 0) * (+x.precio || 0);
  return '<div style="margin-top:12px"><b style="font-size:12.5px">🧾 Insumos y costo por prenda</b> <span class="mu" style="font-size:11.5px">· de 📦 Productos: <b>S/ ' + (+pr.costo_unitario).toFixed(2) + '</b></span>'
    + (L.length ? '<table class="g" style="width:100%"><tr><th>Componente</th><th>Material / proveedor</th><th>Cant.</th><th>Unidad</th><th>Precio</th><th>Subtotal</th></tr>'
        + L.map(x => '<tr><td>' + esc(nom[x.comp] || x.comp) + '</td><td>' + esc(x.descripcion || '') + '</td><td>' + (+x.cantidad) + '</td><td>' + esc(x.unidad || '') + '</td><td>' + S2(x.precio) + '</td><td>' + S2(S(x)) + '</td></tr>').join('') + '</table>'
      : '<div class="mu" style="font-size:11.5px">Todavía sin detalle de insumos (tela, forro, botones…).</div>')
    + '<button type="button" data-n="' + esc(d) + '" onclick="parent.prodAbrirProducto && parent.prodAbrirProducto(this.dataset.n)">✏️ Editar insumos y costos en 📦 Productos →</button></div>';
}
async function firmar(rutas){
  const faltan = rutas.filter(r => !D.urls[r]); if (!faltan.length) return;
  try { const r = await fetch(SB + '/storage/v1/object/sign/produccion', { method:'POST', headers:{ apikey:ANON, Authorization:'Bearer ' + tok(), 'Content-Type':'application/json' }, body: JSON.stringify({ expiresIn: 600, paths: faltan }) });
    const j = await r.json(); (Array.isArray(j) ? j : []).forEach(x => { const u = x.signedURL || x.signedUrl; if (u && x.path) D.urls[x.path] = SB + '/storage/v1' + u; }); } catch (_) {}
}
async function firmarFicha(o){
  const imgs = [...document.querySelectorAll('#oCuerpo img[data-ruta]')]; if (!imgs.length) return;
  await firmar(imgs.map(i => i.dataset.ruta)); imgs.forEach(i => { if (D.urls[i.dataset.ruta]) i.src = D.urls[i.dataset.ruta]; });
}
async function verArchivo(ruta){ await firmar([ruta]); if (D.urls[ruta]) window.open(D.urls[ruta], '_blank'); else aviso('No se pudo abrir el archivo'); }
async function subirFicha(inp, tipo){
  const files = [...inp.files], msg = document.getElementById('fMsg-' + tipo), d = nrm(OA.diseno), slug = d.replace(/[^A-Z0-9]+/g, '-');
  if (!files.length) return; let ok = 0;
  for (const f of files){
    if (f.size > 25 * 1024 * 1024){ msg.textContent = '«' + f.name + '» pesa más de 25 MB'; continue; }
    msg.textContent = 'Subiendo ' + (ok + 1) + ' de ' + files.length + '…';
    const ruta = slug + '/' + tipo + '/' + Date.now() + '_' + f.name.replace(/[^\w.\-]+/g, '_');
    try {
      const r = await fetch(SB + '/storage/v1/object/produccion/' + ruta, { method:'POST', headers:{ apikey:ANON, Authorization:'Bearer ' + tok(), 'Content-Type': f.type || 'application/octet-stream' }, body: f });
      if (!r.ok) throw new Error('no se pudo subir (' + r.status + ')');
      const g = await rpc('prod_archivo_guardar', { p_diseno:d, p_tipo:tipo, p_ruta:ruta, p_nombre:f.name, p_mime:f.type || '' }); if (!g.ok) throw new Error(g.error);
      ok++;
    } catch (e) { msg.textContent = '«' + f.name + '»: ' + e.message; }
  }
  await cargar(); abrirOrden(OA.id);
}
async function borrarArchivo(id){
  try { const r = await rpc('prod_archivo_borrar', { p_arch:id }); if (!r.ok) throw new Error(r.error || 'No se pudo');
    if (r.ruta) await fetch(SB + '/storage/v1/object/produccion/' + r.ruta, { method:'DELETE', headers:{ apikey:ANON, Authorization:'Bearer ' + tok() } }).catch(() => {});
    await cargar(); abrirOrden(OA.id); } catch (e) { aviso(e.message); }
}
function aviso(t){ const m = document.getElementById('msg'); m.textContent = t; m.className = 'err'; setTimeout(() => { m.textContent = ''; m.className = 'mu'; }, 6000); }
function cerrar(id){ document.getElementById(id).style.display = 'none'; }
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ cerrar('mNueva'); cerrar('mOrden'); } });
window.addEventListener('message', e => { const m = e && e.data; if (m && m.tipo === 'erp-tema') document.body.classList.toggle('light', !!m.light);
  if (m && m.tipo === 'prod-recalcular') cargar();   /* 21-oct · Alertas pide la foto al día */
  if (m && m.tipo === 'erp-refrescar'){ try { e.source.postMessage({ tipo:'erp-refrescar-ok' }, '*'); } catch (_) {} cargar(); } });
try { if (parent !== window) parent.postMessage({ tipo:'erp-tema-pedir' }, '*'); } catch (e) {}
if (typeof process === 'undefined') cargar();

<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Precios Tulula</title>
<!-- 20-nov-2026 (Pablo) · PANEL DE PRECIOS para Chatwoot (pestaña al lado de «Pedido Tulula»).
     Lee la tabla de precios del ERP (Producción › Costos y precios) con rpc precios_chat: solo prendas activas y solo precios
     (Lista ×1 ×2 ×3, Live ×1 ×2, Promoción). Nunca costos. Tocar una fila copia sus precios de lista para pegarlos en el chat. -->
<!-- 21-nov-2026 (Pablo) · precios centrados; Lista en verde, Live en amarillo, Promoción en naranja; columna Stock y, al tocar la prenda,
     su stock por color y talla (rpc stock_chat, solo prendas activas con stock). Copiar precios: botón 📋 de cada fila.
     21-nov 10:00 (Pablo) · stock con 1 unidad en naranja; 0 o negativo en rojo (la rpc trae también las tallas en 0 o negativas).
     22-nov (Pablo) · SIN columna Stock: al pasar el cursor por el nombre de la prenda sale un recuadro con su stock color × talla,
     solo con las tallas que se fabricaron (las que trae la rpc). 📋 copia los precios de lista; en el iframe de Chatwoot el
     portapapeles moderno está bloqueado, por eso ahora usa también el método clásico (execCommand).
     23-nov (Pablo) · el recuadro de stock es IGUAL al bloque STOCK del ERP (mismos colores de prenda, cápsulas, encabezado dorado,
     mismos tonos que Stock › COLOR_OVERRIDE/ST_BG). El copiar es un ícono de copiar en CADA precio: copia ese precio. -->
<style>
:root{--bg:#fff;--tx:#1f1b17;--mu:#7a7268;--bd:#e6ded3;--ac:#8b5cf6;--ok:#15803d;--rd:#b91c1c;--hv:rgba(139,92,246,.08);--li:#15803d;--lv:#a16207;--pr:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#1d1f24;--tx:#ece8e2;--mu:#a29a90;--bd:#33363d;--ac:#a78bfa;--ok:#4ade80;--rd:#f87171;--hv:rgba(167,139,250,.12);--li:#4ade80;--lv:#facc15;--pr:#fb923c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 Manrope,system-ui,sans-serif;padding:12px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
h1{font-size:14px;font-weight:600;margin:0;flex:1}
input,select{font:inherit;font-size:13px;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:5px 8px}
input{flex:1;min-width:140px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:11px;font-weight:600;border:1px solid var(--bd);border-radius:999px;padding:3px 10px;cursor:pointer;background:transparent;color:var(--mu)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.wrap{overflow:auto;max-height:calc(100vh - 120px);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;white-space:nowrap}
th{position:sticky;background:var(--bg);font-size:11px;font-weight:500;color:var(--mu);text-transform:uppercase;padding:6px 8px;text-align:center;cursor:pointer;border-bottom:1px solid var(--bd)}
.li{color:var(--li)}.lv{color:var(--lv)}.pr{color:var(--pr)}th.li,th.lv,th.pr{font-weight:600}
.det td{background:var(--hv);text-align:left;white-space:normal;font-size:12px;cursor:default}.det b{font-weight:600}.tl{display:inline-block;margin:0 8px 2px 0}.s1{color:var(--pr);font-weight:600}.s0{color:var(--rd);font-weight:600}.cp{border:0;background:transparent;cursor:pointer;font-size:13px;padding:0 4px}
thead tr:first-child th{top:0;text-align:center;cursor:default}
thead tr:nth-child(2) th{top:26px}
th.l,td.l{text-align:left}
td{padding:5px 8px;text-align:center;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
td.l{max-width:220px;overflow:hidden;text-overflow:ellipsis}
td .c{display:block;font-size:11px;color:var(--mu)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--hv)}
.g1{border-left:1px solid var(--bd)}
#pop{position:fixed;z-index:50;display:none;background:#16161b;border:3px solid #000;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none;overflow:hidden}
#pop table{width:auto;white-space:nowrap;border-collapse:collapse;font-family:Manrope,system-ui,sans-serif}
#pop th{position:static;cursor:default;text-transform:uppercase;font-size:12px;font-weight:600;padding:3px 8px;text-align:center;border:1px solid rgba(0,0,0,.4);background:#261a0a}
#pop th.blk{color:#fbbf24;letter-spacing:.5px;font-size:13px}#pop th.tal{color:#fcd34d}
#pop td{padding:1px 8px;height:24px;line-height:1.1;text-align:center;border:1px solid rgba(0,0,0,.4);font-size:12px}
#pop td.cl{text-align:left;font-weight:600;white-space:nowrap;border-right:3px solid #000}
#pop .cap{display:inline-block;min-width:24px;padding:0 6px;border-radius:3px;background:rgba(255,255,255,.5);color:#10101a;font-weight:600;font-variant-numeric:tabular-nums}
#pop .cap.neg{color:#c81e1e}#pop .dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.5);vertical-align:middle;margin-right:6px}
#pop .t{font-size:12px;font-weight:600;color:#ece8e2;padding:6px 8px;background:#16161b}
td.l{cursor:help}.pc{white-space:nowrap}.cpi{border:0;background:transparent;cursor:pointer;padding:0 0 0 4px;color:var(--mu);vertical-align:-2px;opacity:.55}.cpi:hover{opacity:1;color:var(--ac)}.cpi svg{width:12px;height:12px;display:block}
.vac{color:var(--mu)}
#m{font-size:12px;color:var(--mu);margin-top:6px;min-height:16px}.ok{color:var(--ok)!important}.er{color:var(--rd)!important}
</style></head><body>
<div class="bar"><h1>Precios Tulula</h1><input id="q" type="search" placeholder="Buscar prenda…" autocomplete="off"></div>
<div class="chips" id="cats"></div>
<div class="wrap"><table>
<thead><tr><th class="l"></th><th colspan="3" class="g1 li">Lista</th><th colspan="2" class="g1 lv">Live</th><th class="g1 pr">Promoción</th></tr>
<tr><th class="l" data-k="diseno">Prenda</th><th class="g1 li" data-k="lista">×1</th><th class="li" data-k="lista_x2">×2</th><th class="li" data-k="lista_x3">×3</th>
<th class="g1 lv" data-k="live">×1</th><th class="lv" data-k="live_x2">×2</th><th class="g1 pr" data-k="promo">×1</th></tr></thead>
<tbody id="tb"><tr><td colspan="7" class="l vac">Cargando precios…</td></tr></tbody></table></div>
<div id="pop"></div>
<div id="m">Pasa el cursor por una prenda para ver su stock · el ícono de copiar al lado de cada precio copia ese precio.</div>
<script>
const SB = 'https://vlilvrxfppppzwyaeviu.supabase.co', ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsaWx2cnhmcHBwcHp3eWFldml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NDIwMTMsImV4cCI6MjEwMDIxODAxM30.Bmo4CNDDbSF7Vp9JpDm7ceKUlsKKdufKcKFDIGHS4Hs';
const COLS = ['lista', 'lista_x2', 'lista_x3', 'live', 'live_x2', 'promo'];
const CLS = ['g1 li', 'li', 'li', 'g1 lv', 'lv', 'g1 pr'];
const TALLAS = ['XXS', 'XS', 'S', 'M', 'L', 'XL', '2XL', 'XXL', '3XL', 'XXXL', '4XL', 'U', 'STD', 'UNICA'];
let F = [], CAT = 'TODAS', ORD = { k: null, asc: true }, ST = {}, ABIERTA = -1;
const $ = id => document.getElementById(id);
const ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const S = v => (v == null || v === '' || !(+v > 0)) ? '' : 'S/ ' + (+v).toFixed(2).replace(/\.00$/, '');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
function msg(t, c) { $('m').className = c || ''; $('m').textContent = t; }
function filas() {
  const q = norm($('q').value).trim().split(/\s+/).filter(Boolean);
  let L = F.filter(r => (CAT === 'TODAS' || r.categoria === CAT) && q.every(w => norm(r.diseno + ' ' + r.tipo + ' ' + r.categoria).includes(w)));
  if (ORD.k) L = L.slice().sort((a, b) => { const x = a[ORD.k], y = b[ORD.k];
    const r = ORD.k === 'diseno' ? String(x).localeCompare(String(y)) : ((+x || 0) - (+y || 0)); return ORD.asc ? r : -r; });
  return L;
}
function cS(n) { n = +n || 0; return '<span class="' + (n <= 0 ? 's0' : n === 1 ? 's1' : '') + '">' + n + '</span>'; }
function ordT(t) { const i = TALLAS.indexOf(t); return i < 0 ? 50 + (parseInt(t, 10) || 0) : i; }
// 23-nov · MISMA paleta que el ERP (Stock: ST_BG; los cambios hechos en el ERP llegan por la rpc colores_listar_calc si está abierta).
const ST_BG = {'BLANCO':'#e9e9ec','PERLA':'#d8d4cf','NUDE':'#e0b9a8','BEIGE':'#d4b483','BEIGE_CLARO':'#e2d2ab','BEIGE_OSCURO':'#b89455','ARENA':'#d2b48c','HUESO':'#e6dfcd','AVENA':'#d0c192','CELESTE':'#38bdf8','ROSA':'#ec4899','LILA':'#a78bfa','PLOMO_CLARO':'#94a3b8','NEGRO':'#08080a','VINO':'#be123c','ROJO':'#ef4444','CORAL':'#fb7150','FUCSIA':'#e91e8c','MORADO':'#9333ea','AZUL':'#2563eb','AZULINO':'#0ea5e9','VERDE':'#16a34a','NARANJA':'#f97316','AMARILLO':'#eab308','MARRON':'#9a5a2c','GRIS':'#94a3b8','PLOMO':'#64748b','PLOMO_OSCURO':'#475569','MOCA':'#a96a3c','COCOA':'#7a4a30','CAMEL':'#c08842','LACRE':'#dc2626','AZUL_MARINO':'#1e3a8a','AZUL_NOCHE':'#1e40af','PRINT':'#6b7280'};
// Tonos editados en el ERP (Configuración › colores): copia del 23-nov + la copia que el ERP guarda en este navegador (erp_colores),
// que manda si existe (misma página github.io). La rpc colores_listar_calc no está abierta al público (401).
let COLOR_OVERRIDE = {"ROSA":"#f9a8d4","TOPO":"#ca8a04","VINO":"#800000","BEIGE":"#d4b483","CREMA":"#fefce8","MALVA":"#a78bfa","NEGRO":"#000000","PERLA":"#ffffff","PLATA":"#9ca3af","TOFEE":"#ca8a04","DORADO":"#fde047","MARRON":"#78350f","TOFFEE":"#eab308","AMARILLO":"#fef08a","FUCSIA-T":"#f9a8d4","VAINILLA":"#fef9c3","CHOCOLATE":"#c08842","AZUL_ACERO":"#1e3a8a","AZUL_RAYAS":"#1e3a8a","LADRILLO-B":"#b35103","LADRILLO-T":"#b35103","ROSA_RAYAS":"#fecaca","UVA_PASTEL":"#a78bfa","VINO_RAYAS":"#dc2626","ARENA_RAYAS":"#e6dfcd","BEIGE_RAYAS":"#d4b483","NEGRO_RAYAS":"#6b7280","PLOMO_RAYAS":"#6b7280","VERDE_CLARO":"#bbf7d0","LADRILLO_TOP":"#b35103","VERDE_OSCURO":"#14532d","CELESTE_RAYAS":"#60a5fa","AZUL_PRESIDENTE":"#1e3a8a","LADRILLO_BOTTOM":"#b35103","PERLA_SUBLIMADO":"#d1d5db"};
try { const _co = JSON.parse(localStorage.getItem('erp_colores') || 'null'); if (_co && typeof _co === 'object') COLOR_OVERRIDE = Object.assign({}, COLOR_OVERRIDE, _co); } catch (_) {}
const stBg = c => { const k = String(c || '').toUpperCase().replace(/ /g, '_'); return COLOR_OVERRIDE[k] || ST_BG[k] || null; };
const stLum = hex => { const h = String(hex || '').replace('#', ''); if (h.length < 6) return 0; return 0.299 * parseInt(h.slice(0, 2), 16) + 0.587 * parseInt(h.slice(2, 4), 16) + 0.114 * parseInt(h.slice(4, 6), 16); };
const stTx = c => { const bg = stBg(c); return (bg && stLum(bg) > 150) ? '#10101a' : '#f5f5fa'; };
const BASEBG = 'rgba(125,130,145,.16)';
// Stock color × talla de UNA prenda, igual que el bloque STOCK del ERP, solo con las tallas que se fabricaron (las que trae la rpc).
function detalle(r) {
  const D = ST[r.diseno] || {}, cols = Object.keys(D).sort();
  if (!cols.length) return '<div class="t">' + esc(r.diseno) + ' · sin stock registrado</div>';
  const tl = [...new Set([].concat(...cols.map(c => Object.keys(D[c]))))].sort((x, y) => ordT(x) - ordT(y));
  const cap = v => '<span class="cap' + (v < 0 ? ' neg' : '') + '">' + v + '</span>';
  return '<div class="t">' + esc(r.diseno) + '</div><table><tr><th rowspan="2" style="color:#a29a90">Color</th><th class="blk" colspan="' + tl.length + '">Stock</th></tr>'
    + '<tr>' + tl.map(t => '<th class="tal">' + esc(t) + '</th>').join('') + '</tr>'
    + cols.map(c => { const bg = stBg(c) || BASEBG, tx = stBg(c) ? stTx(c) : '#ece8e2';
      return '<tr><td class="cl" style="background:' + bg + ';color:' + tx + '"><span class="dot" style="background:' + (stBg(c) || '#666') + '"></span>' + esc(c || 'SIN COLOR') + '</td>'
        + tl.map(t => D[c][t] == null ? '<td style="background:#26262c;color:#6b7280">–</td>' : '<td style="background:' + bg + '">' + cap(+D[c][t] || 0) + '</td>').join('') + '</tr>'; }).join('')
    + '</table>';
}
function verPop(td, r) {
  const p = $('pop'); p.innerHTML = detalle(r); p.style.display = 'block';
  const b = td.getBoundingClientRect(), w = p.offsetWidth, h = p.offsetHeight;
  p.style.left = Math.max(6, Math.min(innerWidth - w - 6, b.left)) + 'px';
  p.style.top = (b.bottom + h + 6 < innerHeight ? b.bottom + 4 : Math.max(6, b.top - h - 4)) + 'px';
}
function pintar() {
  const L = filas();
  $('tb').innerHTML = L.length ? L.map(r => { const i = F.indexOf(r);
    return '<tr data-i="' + i + '"><td class="l" title="' + esc(r.diseno) + '">' + esc(r.diseno) + '<span class="c">' + esc(r.categoria) + '</span></td>'
    + COLS.map((k, j) => '<td class="' + CLS[j] + '">' + (S(r[k]) ? '<span class="pc">' + S(r[k]) + '<button class="cpi" data-cp="' + i + '" data-k="' + k + '" title="Copiar este precio">' + ICO + '</button></span>' : '<span class="vac">—</span>') + '</td>').join('')
    + '</tr>'
; }).join('')
    : '<tr><td colspan="7" class="l vac">Ninguna prenda con ese filtro.</td></tr>';
}
function chips() {
  const cs = ['TODAS'].concat([...new Set(F.map(r => r.categoria))]);
  $('cats').innerHTML = cs.map(c => '<button class="chip' + (c === CAT ? ' on' : '') + '" data-c="' + esc(c) + '">' + esc(c === 'TODAS' ? 'Todas' : c.charAt(0) + c.slice(1).toLowerCase()) + '</button>').join('');
}
$('cats').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; CAT = b.dataset.c; chips(); pintar(); });
$('q').addEventListener('input', pintar);
document.querySelector('thead').addEventListener('click', e => { const th = e.target.closest('th[data-k]'); if (!th) return;
  const k = th.dataset.k; ORD = { k, asc: ORD.k === k ? !ORD.asc : k === 'diseno' }; pintar(); });
$('tb').addEventListener('click', async e => {
  const cp = e.target.closest('[data-cp]');
  if (cp) { const r = F[+cp.dataset.cp], k = cp.dataset.k;
    const ETQ = { lista: '1 prenda', lista_x2: '2 prendas', lista_x3: '3 prendas', live: 'Live 1 prenda', live_x2: 'Live 2 prendas', promo: 'Promoción' };
    const t = r.diseno.charAt(0) + r.diseno.slice(1).toLowerCase() + ' · ' + ETQ[k] + ': ' + S(r[k]);
    let ok = false; try { await navigator.clipboard.writeText(t); ok = true; } catch (_) {}
    if (!ok) { try { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); } catch (_) {} }
    msg(ok ? '✓ Copiado: ' + t : 'No se pudo copiar. Selecciona y copia: ' + t, ok ? 'ok' : ''); return; }
  const td = e.target.closest('td.l'); const tr = td && td.closest('tr[data-i]'); if (tr) verPop(td, F[+tr.dataset.i]); });   // toque (celular): muestra el stock
$('tb').addEventListener('mouseover', e => { const td = e.target.closest('td.l'); const tr = td && td.closest('tr[data-i]'); if (tr) verPop(td, F[+tr.dataset.i]); });
$('tb').addEventListener('mouseout', e => { const td = e.target.closest('td.l'); if (td && !td.contains(e.relatedTarget)) $('pop').style.display = 'none'; });
$('q').addEventListener('focus', () => { $('pop').style.display = 'none'; });
const H = { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' };
function cargarColores() {   // 23-nov · los tonos editados en el ERP (si la base los comparte); si no, la paleta de siempre
  return fetch(SB + '/rest/v1/rpc/colores_listar_calc', { method: 'POST', headers: H, body: '{}' }).then(r => r.ok ? r.json() : null)
    .then(j => { const m = j && (j.data || j); if (m && typeof m === 'object' && !Array.isArray(m)) COLOR_OVERRIDE = Object.assign({}, COLOR_OVERRIDE, m); }).catch(() => {});
}
function cargarStock() {
  return fetch(SB + '/rest/v1/rpc/stock_chat', { method: 'POST', headers: H, body: '{}' }).then(r => r.ok ? r.json() : []).then(j => {
    ST = {}; (Array.isArray(j) ? j : []).forEach(x => { const d = ST[x.diseno] || (ST[x.diseno] = {}), c = d[x.color] || (d[x.color] = {}); c[x.talla] = (c[x.talla] || 0) + (+x.stock || 0); });
    F.forEach(r => { const D = ST[r.diseno] || {}; r.stock = Object.values(D).reduce((a, c) => a + Object.values(c).reduce((b, n) => b + Math.max(0, n), 0), 0); });
  }).catch(() => {});
}
fetch(SB + '/rest/v1/rpc/precios_chat', { method: 'POST', headers: H, body: '{}' })
  .then(r => r.ok ? r.json() : Promise.reject(new Error('error ' + r.status)))
  .then(j => { F = (j || []).map(r => Object.assign(r, { categoria: String(r.categoria || 'OTROS').toUpperCase(), diseno: String(r.diseno || '').toUpperCase(), stock: 0 })); chips(); pintar(); return Promise.all([cargarStock(), cargarColores()]).then(pintar); })
  .catch(e => { $('tb').innerHTML = '<tr><td colspan="7" class="l er">No pude leer los precios del ERP (' + esc(e.message) + ').</td></tr>'; });
</script></body></html>

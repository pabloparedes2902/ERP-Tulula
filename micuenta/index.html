<style>
:root{--az:#173B61;--na:#C15B07;--ve:#2E7D4F;--cr:#EDEAE3;--gr:#D3DBE5;--tx:#1d2733;--pl:#6b7785}
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--cr);color:var(--tx);font-size:15px}
header{background:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--gr);position:sticky;top:0}
header img{height:28px}header button{background:none;border:0;color:var(--pl);font:inherit;font-size:13px;cursor:pointer}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(23,59,97,.06)}
h1{font-size:20px;font-weight:600;color:var(--az);margin:4px 0 12px}h2{font-size:16px;font-weight:600;margin:0 0 4px;color:var(--az)}

.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--az);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.btn.sec{background:#fff;color:var(--az);border:1px solid var(--az)}.btn:disabled{opacity:.5}
.pasos{list-style:none;padding:0;margin:14px 0 4px}
.paso{display:flex;gap:12px;position:relative;padding-bottom:16px}
.paso:not(:last-child):before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--gr)}
.paso.ok:not(:last-child):before{background:var(--ve)}
.pto{width:24px;height:24px;border-radius:50%;border:2px solid var(--gr);background:#fff;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.paso.ok .pto{background:var(--ve);border-color:var(--ve)}
.paso b{font-weight:600;display:block}.paso span{color:var(--pl);font-size:13px}
.ag{background:var(--cr);border-radius:12px;padding:12px;margin-top:8px;font-size:14px}.ag a{color:var(--na);font-weight:600}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--gr);font-size:14px}.sw input{width:22px;height:22px;flex:0 0 22px;margin:0 0 0 12px;padding:0;accent-color:var(--ve)}
.vt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.vt a{text-decoration:none;color:var(--tx)}.vt img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--gr)}.vt b{display:block;font-size:13px;font-weight:600;margin-top:6px;color:var(--az)}.vt span{font-size:12px;color:var(--pl)}
.btn.wa{background:var(--na);margin-top:10px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--gr);color:var(--az)}
#inst{display:none}.err{color:#b42318;font-size:13px;min-height:18px}

<script>
/* Mi Cuenta Tulula · 24-nov-2026. Lee la base solo por funciones que devuelven el pedido de la clienta (enlace privado o sesión con código al correo). */
const SB = 'https://vlilvrxfppppzwyaeviu.supabase.co', AN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsaWx2cnhmcHBwcHp3eWFldml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NDIwMTMsImV4cCI6MjEwMDIxODAxM30.Bmo4CNDDbSF7Vp9JpDm7ceKUlsKKdufKcKFDIGHS4Hs';
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS = { g(k){ try { return localStorage.getItem(k); } catch(_) { return null; } }, s(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(_){} } };
async function rpc(fn, args){
  const r = await fetch(SB + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: AN, Authorization: 'Bearer ' + AN, 'Content-Type': 'application/json', 'Content-Profile': 'erp', 'Accept-Profile': 'erp' }, body: JSON.stringify(args) });
  if (!r.ok) throw new Error('HTTP ' + r.status); return r.json();
}
const fh = t => { if (!t) return ''; const d = new Date(t); return d.toLocaleString('es-PE', { timeZone: 'America/Lima', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true }).replace('.', ''); };
const CUR = { SHALOM: 'Shalom', OLVA: 'Olva', SALVA: 'nuestro motorizado', INDRIVER: 'el motorizado', RECOJO: 'recojo en almacén' };
function pasos(p){
  const e = p.eventos || {}, est = String(p.estado || '').toUpperCase(), salio = ['EN CAMINO','ENTREGADO'].includes(est), fin = est === 'ENTREGADO';
  const c = CUR[p.courier] || 'el courier', ag = p.agencia;
  const reg = e.REGISTRADO || e.REGISTRADO_ERP || e.SEPARAR || e.ENVIAR;
  // 25-nov (Pablo) · Shalom y Olva con los mismos 5 pasos; el resto 3. Hecho = verde; el siguiente dice «Siguiente», en blanco.
  const agc = p.courier === 'SHALOM' || p.courier === 'OLVA', dz = ag && ag.zona ? ' · ' + ag.zona : '';
  const L = agc ? [
    { t: 'Pedido confirmado', ts: reg },
    { t: 'Entregado a ' + c, ts: e['EN CAMINO'] || e.SH_CREADO || e.SH_ORIGEN || e.OL_ORIGEN, ok: salio },
    { t: 'En camino' + (p.destino ? ' a ' + p.destino : ' a tu ciudad'), ts: e.SH_TRANSITO || e.SH_REPARTO || e.OL_TRANSITO },
    { t: 'Llegó a tu agencia' + dz, ts: e.SH_DESTINO || e.OL_DESTINO },
    { t: 'Recogido', ts: e.SH_ENTREGADO || e.OL_ENTREGADO || e.ENTREGADO, ok: fin }
  ] : [
    { t: 'Pedido confirmado', ts: reg },
    { t: p.courier === 'RECOJO' ? 'Listo para recoger' : 'En camino con ' + c, ts: e['EN CAMINO'], ok: salio },
    { t: p.courier === 'RECOJO' ? 'Recogido' : 'Entregado', ts: e.ENTREGADO, ok: fin }
  ];
  let ult = 0; L.forEach((x, i) => { if (x.ts || x.ok) ult = i; });
  L.forEach((x, i) => { x.ok = i <= ult; });
  const act = L.findIndex(x => !x.ok);
  return '<ul class="pasos">' + L.map((x, i) => '<li class="paso' + (x.ok ? ' ok' : '') + '"><div class="pto">' + (x.ok ? '✓' : '') + '</div><div><b>' + esc(x.t) + '</b><span>' + (x.ts ? fh(x.ts) : (i === act ? 'Siguiente' : '')) + '</span></div></li>').join('') + '</ul>';
}
function tarjeta(p){

    + (g.clave_oculta ? '<p class="nota">🔒 Tu clave de recojo aparecerá aquí cuando completes tu pago' + (Number(g.debe) > 0 ? ' (te falta S/ ' + Number(g.debe).toFixed(2) + ')' : '') + '.</p>' : '');   // 25-nov · clave solo con pago completo
  if (ag) h += '<div class="ag"><b>Agencia ' + esc(CUR[ag.courier] || ag.courier) + ' · ' + esc(ag.zona || '') + '</b><br>' + esc(ag.direccion || '') + (ag.horario ? '<br><span class="nota">' + esc(ag.horario) + (ag.domingo ? ' · Domingo ' + esc(ag.domingo) : '') + '</span>' : '') + (ag.lat && ag.lng ? '<br><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=' + ag.lat + ',' + ag.lng + '">Ver en el mapa</a>' : '') + '</div>';
  return h + '</div>';
}
// 25-nov (Pablo) · instalar con los menos pasos posibles. Android/Chrome: 1 botón. iPhone: Apple no permite botón directo,
// se muestra la guía de 2 toques con flecha al botón Compartir. Dentro de Instagram/WhatsApp/Facebook: primero abrir en Safari/Chrome.
const instalar = '<div class="card" id="inst" style="display:none"><h2>Agrega Tulula a tu celular</h2><p class="nota">Tus pedidos, tus puntos y lo nuevo, a un toque.</p><button class="btn" onclick="inst()">Agregar a mi celular</button></div>'
  + '<div class="card" id="ios" style="display:none"><h2>Agrega Tulula a tu iPhone</h2><p class="nota">Son 2 toques:</p><ol style="margin:8px 0 0 18px;padding:0;line-height:1.9"><li>Toca <b>Compartir</b> <span style="display:inline-block;border:1px solid var(--gr);border-radius:6px;padding:0 6px">⬆︎</span> abajo en Safari</li><li>Elige <b>Agregar a inicio</b> <span style="display:inline-block;border:1px solid var(--gr);border-radius:6px;padding:0 6px">＋</span></li></ol></div>'
  + '<div class="card" id="dentro" style="display:none"><h2>Abre esta página en tu navegador</h2><p class="nota">Desde Instagram o WhatsApp no se puede agregar. Copia el enlace y ábrelo en <b id="nav">Safari</b>.</p><button class="btn" onclick="copiarEnlace(this)">Copiar enlace</button></div>'
  + '<div id="flecha" style="display:none;position:fixed;bottom:8px;left:50%;transform:translateX(-50%);background:var(--az);color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25)">Toca <b>Compartir ⬆︎</b> aquí abajo y luego <b>Agregar a inicio</b> <span onclick="this.parentElement.remove()" style="margin-left:8px;cursor:pointer">✕</span></div>';
async function copiarEnlace(b){ try { await navigator.clipboard.writeText(location.href); b.textContent = 'Enlace copiado ✓'; } catch(_) { prompt('Copia este enlace:', location.href); } }
let evInst = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); evInst = e; const c = $('#inst'); if (c) c.style.display = 'block'; });
async function inst(){ if (!evInst) return; evInst.prompt(); await evInst.userChoice; evInst = null; const c = $('#inst'); if (c) c.style.display = 'none'; }
function iosAviso(){
  const ua = navigator.userAgent, ios = /iphone|ipad/i.test(ua), solo = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (solo) return;
  if (/Instagram|FBAN|FBAV|WhatsApp|Line\/|TikTok/i.test(ua)) { const d = $('#dentro'); if (d) { d.style.display = 'block'; $('#nav').textContent = ios ? 'Safari' : 'Chrome'; } return; }
  if (ios) { const c = $('#ios'); if (c) c.style.display = 'block'; if (!LS.g('mc_flecha')) { const f = $('#flecha'); if (f) { f.style.display = 'block'; LS.s('mc_flecha', '1'); setTimeout(() => f.remove(), 12000); } } }
}
function entrar(msg){
  $('#salir').style.display = 'none';
  app.innerHTML = '<h1>Mi cuenta</h1><div class="card"><h2>Entra con tu correo</h2><p class="nota">El mismo correo que diste al comprar. Te enviamos un código de 6 dígitos.</p><input id="em" type="email" inputmode="email" autocomplete="email" placeholder="tucorreo@gmail.com"><div class="err" id="er">' + esc(msg || '') + '</div><button class="btn" id="b1" onclick="pedir()">Enviarme el código</button></div>' + instalar;
  iosAviso();
}
async function pedir(){
  const em = $('#em').value.trim(); if (!em) return; $('#b1').disabled = true; $('#er').textContent = '';
  try { const r = await rpc('micuenta_codigo_pedir', { p_email: em });
    if (r === 'correo_invalido') { $('#er').textContent = 'Revisa tu correo, parece incompleto.'; $('#b1').disabled = false; return; }
    if (r === 'espera') { $('#er').textContent = 'Pediste muchos códigos. Intenta en una hora.'; $('#b1').disabled = false; return; }
    if (r === 'sin_correo_configurado') { $('#er').textContent = 'Todavía no enviamos códigos. Usa el enlace que te mandó tu asesora.'; $('#b1').disabled = false; return; }
    LS.s('mc_email', em);
    app.innerHTML = '<h1>Mi cuenta</h1><div class="card"><h2>Revisa tu correo</h2><p class="nota">Si <b>' + esc(em) + '</b> tiene pedidos en Tulula, te llegó un código. Mira también en Spam o Promociones.</p><input id="cd" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"><div class="err" id="er"></div><button class="btn" id="b2" onclick="validar()">Entrar</button><p></p><button class="btn sec" onclick="entrar()">Usar otro correo</button></div>';
  } catch(e) { $('#er').textContent = 'No pudimos conectarnos. Intenta otra vez.'; $('#b1').disabled = false; }
}
async function validar(){
  const cd = $('#cd').value.trim(), em = LS.g('mc_email'); if (cd.length !== 6) return; $('#b2').disabled = true;
  try { const t = await rpc('micuenta_codigo_validar', { p_email: em, p_codigo: cd });
    if (!t) { $('#er').textContent = 'Código incorrecto o vencido.'; $('#b2').disabled = false; return; }
    LS.s('mc_sesion', t); misPedidos();
  } catch(e) { $('#er').textContent = 'No pudimos conectarnos. Intenta otra vez.'; $('#b2').disabled = false; }
}
async function misPedidos(){
  const t = LS.g('mc_sesion'); if (!t) return entrar();
  try { const r = await rpc('micuenta_mis_pedidos', { p_sesion: t });
    if (!r) { LS.s('mc_sesion', null); return entrar('Tu sesión venció. Entra otra vez.'); }
    const P = r.pedidos || [], n = P[0] && P[0].nombre;
    $('#salir').style.display = '';
    app.innerHTML = '<h1>' + (n ? 'Hola, ' + esc(n) : 'Mis pedidos') + '</h1>' + (P.length ? P.map(tarjeta).join('') : '<div class="card"><p class="nota">Aún no vemos pedidos con este correo.</p></div>') + perfilCaja() + vitrinaCaja() + avisosCaja() + instalar;
    iosAviso(); if (evInst) $('#inst').style.display = 'block'; avisosCargar(t); perfilCargar(t); vitrinaCargar(P);
  } catch(e) { app.innerHTML = '<div class="card"><p class="err">No pudimos conectarnos. Revisa tu internet.</p><button class="btn" onclick="misPedidos()">Reintentar</button></div>'; }
}
async function porEnlace(tok){
  try { const p = await rpc('micuenta_por_enlace', { p_token: tok });
    if (!p) return entrar('Ese enlace no es válido. Entra con tu correo.');
    guardarEnlace(tok);
    const otros = enlaces().filter(t => t !== tok), mas = [];
    for (const t of otros) { try { const q = await rpc('micuenta_por_enlace', { p_token: t }); if (q) mas.push(q); } catch(_){} }
    app.innerHTML = '<h1>' + (p.nombre ? 'Hola, ' + esc(p.nombre) : 'Tu pedido') + '</h1>' + tarjeta(p) + mas.map(tarjeta).join('') + perfilCaja() + vitrinaCaja() + avisosCaja() + instalar;
    iosAviso(); if (evInst) $('#inst').style.display = 'block'; avisosCargar(tok); perfilCargar(tok); vitrinaCargar([p].concat(mas));
  } catch(e) { app.innerHTML = '<div class="card"><p class="err">No pudimos conectarnos. Revisa tu internet.</p><button class="btn" onclick="location.reload()">Reintentar</button></div>'; }
}
// 25-nov · enlaces abiertos en este celular (la app instalada los muestra sin pedir correo)
function enlaces(){ try { return JSON.parse(LS.g('mc_enlaces') || '[]'); } catch(_) { return []; } }
function guardarEnlace(t){ const L = [t].concat(enlaces().filter(x => x !== t)).slice(0, 10); LS.s('mc_enlaces', JSON.stringify(L)); }
// 25-nov · Fase 1 «Mis avisos»: la clienta elige qué recibe; cada cambio queda con fecha y hora en la base
const AVISOS = [['pedido', 'Estado de mis pedidos'], ['lanzamientos', 'Nuevos ingresos'], ['descuentos', 'Descuentos y promociones'], ['showroom', 'Showroom y videollamadas'], ['puntos', 'Mis puntos y mi cumpleaños']];
let _llave = null;
// 25-nov (Pablo) · «Mi cuenta»: nivel (Super VIP / VIP / Clienta, el mismo segmento del ERP), cumpleaños y puntos
function perfilCaja(){ return '<div class="card" id="perfil" style="display:none"><h2>Mi cuenta</h2><div id="pf"></div></div>'; }
async function perfilCargar(llave){
  try { const r = await rpc('micuenta_perfil_leer', { p_llave: llave }); if (!r) return;
    const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];

      + (r.siguiente && Number(r.falta) > 0 ? ' <span class="nota">Te faltan S/ ' + Number(r.falta).toFixed(0) + ' en compras para ser ' + esc(r.siguiente) + '</span>' : '') + '</p>';
    if (r.cumple) { const f = r.cumple.split('-'); h += '<p class="sw" style="border:0;padding:6px 0"><span>🎂 Tu cumpleaños: <b>' + Number(f[2]) + ' de ' + MES[Number(f[1]) - 1] + '</b></span></p><p class="nota">En tu mes de cumpleaños tienes un regalo especial de Tulula.</p>'; }
    else h += '<p style="margin:10px 0 0"><b>¿Cuándo es tu cumpleaños?</b></p><p class="nota">En tu mes de cumpleaños te damos <b>20% de descuento</b> en una prenda.</p><input id="pf-f" type="date" max="' + new Date(Date.now() - 15 * 365.25 * 864e5).toISOString().slice(0, 10) + '"><div class="err" id="pf-e"></div><button class="btn" id="pf-b" onclick="cumpleGuardar()">Guardar mi cumpleaños</button>';

async function cumpleGuardar(){

function avisosCaja(){ return '<div class="card" id="avisos" style="display:none"><h2 id="av-t">Mis avisos</h2><p class="nota" id="av-n"></p><div id="av-l"></div></div>'; }

const TIENDA = 'https://tulula.com.pe', WA = '51978102203';

const _norm = t => String(t || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function _prod(p, camp){
  const v = (p.variants || []).filter(x => x.available), img = p.images && p.images[0] && p.images[0].src;
  if (!v.length || !img) return '';
  const pr = Math.min.apply(null, v.map(x => Number(x.price))), ORD = ['XS','S','M','L','XL','2XL','3XL','U'], tallas = Array.from(new Set(v.map(x => String(x.title).split(' / ').pop()))).sort((a, b) => (ORD.indexOf(a) + 99) % 99 - (ORD.indexOf(b) + 99) % 99).slice(0, 5).join(' · ');
  return '<a target="_blank" rel="noopener" href="' + TIENDA + '/products/' + encodeURIComponent(p.handle) + '?' + UTM(camp) + '"><img loading="lazy" alt="' + esc(p.title) + '" src="' + esc(img) + (img.indexOf('?') > 0 ? '&' : '?') + 'width=360"><b>' + esc(p.title) + '</b><span>S/ ' + pr.toFixed(2) + ' · ' + esc(tallas) + '</span></a>';
}
async function vitrinaCargar(P){
  try {
    const nro = P[0] && P[0].nro;
    $('#vt-as').href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent('Hola 😊 Soy clienta' + (nro ? ' del pedido #' + nro : '') + ' y quiero que me ayuden a elegir más prendas.');
    $('#vt-sh').href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent('Hola 😊 Quiero agendar una cita para ver prendas (virtual o presencial).');
    $('#vt-todo').href = TIENDA + '/collections/all?' + UTM('tienda');
    $('#vt-w').style.display = 'block';
    const r = await fetch(TIENDA + '/products.json?limit=250'); if (!r.ok) return;
    const L = ((await r.json()).products || []).filter(p => !/RESERVA|GIFT|TARJETA/i.test(p.title + ' ' + p.product_type));
    const compradas = P.map(x => _norm(x.prendas)).join(' | ');
    const familias = Array.from(new Set(compradas.split(/[|·]/).map(t => t.trim().split(/\s+/)[1]).filter(w => w && w.length > 3)));
    const comb = L.filter(p => { const t = _norm(p.title); return familias.some(f => t.indexOf(f) >= 0) && compradas.indexOf(t) < 0; }).map(p => _prod(p, 'combina')).filter(Boolean).slice(0, 4);
    if (comb.length) { $('#vt-c-l').innerHTML = comb.join(''); $('#vt-c').style.display = 'block'; }
    const nuevos = L.slice().sort((a, b) => String(b.created_at).localeCompare(String(a.created_at))).map(p => _prod(p, 'nuevo')).filter(Boolean).slice(0, 6);
    if (nuevos.length) { $('#vt-n-l').innerHTML = nuevos.join(''); $('#vt-n').style.display = 'block'; }
  } catch(_) {}
}
